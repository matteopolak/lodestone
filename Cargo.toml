[workspace]
resolver = "3"
# `crates/lodestone-*` deliberately avoids matching the `crates/protocol/` and
# `crates/plugins/` grouping dirs, each of which gets its own glob so a new member
# needs no manifest edit. `crates/plugins/*` is where **plugins** live — crates
# that consume the public plugin API (`docs/plugin-api.md`) rather than being part
# of the engine, and which carry their own `LICENSE` because the copyleft boundary
# is per-plugin. See `crates/plugins/README.md`.
members = [
    "crates/lodestone-*",
    "crates/plugins/*",
    "crates/protocol/*",
    "xtask",
]
# So `cargo run --release` from the repo root launches the game.
#
# Without this, a bare `cargo run` in a virtual workspace fails ("could not
# determine which package to use") and needs `-p lodestone-shell`. Note the
# binary is `lodestone` while the crate is `lodestone-shell`, so the error does
# not point at the fix.
#
# It only changes what a *default-member* command picks — `cargo run`, and
# `cargo build`/`test` with no `-p`/`--workspace`. It does **not** narrow
# `--workspace`, which is what every command in `CLAUDE.md` uses, so the health
# checks still cover every crate.
default-members = ["crates/lodestone-shell"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matthew/lodestone"

[workspace.dependencies]
lodestone-core   = { path = "crates/lodestone-core" }
lodestone-macros = { path = "crates/lodestone-macros" }
lodestone-model  = { path = "crates/lodestone-model" }
lodestone-world  = { path = "crates/lodestone-world" }
lodestone-net    = { path = "crates/lodestone-net" }
lodestone-auth   = { path = "crates/lodestone-auth" }
lodestone-client = { path = "crates/lodestone-client" }
lodestone-game   = { path = "crates/lodestone-game" }
lodestone-assets = { path = "crates/lodestone-assets" }
lodestone-particle = { path = "crates/lodestone-particle" }
lodestone-sound  = { path = "crates/lodestone-sound" }
lodestone-registry = { path = "crates/lodestone-registry" }
lodestone-testsupport = { path = "crates/lodestone-testsupport" }
lodestone-physics = { path = "crates/lodestone-physics" }
lodestone-entity = { path = "crates/lodestone-entity" }
lodestone-data   = { path = "crates/lodestone-data" }
lodestone-v770   = { path = "crates/protocol/v770" }
lodestone-v47    = { path = "crates/protocol/v47" }
lodestone-v340 = { path = "crates/protocol/v340" }
lodestone-v735 = { path = "crates/protocol/v735" }
lodestone-ecs  = { path = "crates/lodestone-ecs" }
# Plugins (`crates/plugins/`, `docs/autonomous-navigation.md`). Listed here so a
# plugin that depends on another plugin does not spell a relative path, and so the
# licence boundary is visible in one place: both are LGPL-3.0-or-later, unlike the
# MIT-OR-Apache-2.0 engine.
lodestone-nav = { path = "crates/plugins/lodestone-nav" }
lodestone-autopilot = { path = "crates/plugins/lodestone-autopilot" }

thiserror = "2"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"
png = "0.18"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v3", "v4", "js"] }
flate2 = "1"
wasm-bindgen-futures = "0.4"
syn = { version = "3", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
serde_json = "1"
anyhow = "1"
wgpu = "30"
winit = "0.30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.33"
rayon = "1.12"

# --- ECS (owned by lodestone-ecs; docs/bevy-migration.md) ---
# `default-features = false, features = ["std"]`: no `multi_threaded` (does not
# even compile on wasm32 with no threads), no `bevy_reflect` (default-on,
# heavyweight, unneeded). Left off on every target, not just wasm, so native and
# wasm run the same executor and the same system order (§3.1: Cargo features are
# advisory under unification, so the boundary must not be feature-gated).
bevy_app = { version = "0.19", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
parking_lot = "0.12"

# --- Networking / crypto / auth (owned by lodestone-net + lodestone-auth) ---
# AES-128-CFB8 online-mode cipher (pure-Rust RustCrypto, wasm-safe). `rsa` 0.9 is
# built against `rand_core` 0.6, so `rand` is pinned to 0.8 for interop.
aes = "0.9"
cfb8 = "0.9"
rsa = "0.9"
rand = "0.8"
sha1 = "0.10"
# PKCE's S256 challenge is `base64url(sha256(verifier))` (RFC 7636 §4.2). `sha1`
# above is for the Minecraft server-ID hash and is not interchangeable — the two
# live side by side because they answer to different specs, not because either is
# a fallback for the other.
sha2 = "0.10"
num-bigint = "0.4"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
# HTTP client for the MS OAuth / Xbox / XSTS / Minecraft-services chain and the
# session-server join. rustls avoids a system OpenSSL dependency.
#
# `rustls-no-provider`, NOT `rustls` — deliberately, see issue #446. reqwest's
# `rustls` feature is `["__rustls-aws-lc-rs", "dep:rustls-platform-verifier",
# "__rustls"]`: it *hard-wires* the crypto provider to `aws-lc-rs`, and there is
# no `rustls-ring` feature to pick instead. `aws-lc-sys` vendors ~1,500 C
# translation units, is compiled by a build script (so `sccache`, which wraps
# rustc, cannot cache it), and is therefore rebuilt from scratch in every target
# directory — 25 concurrent copies were counted, and 137 GB of per-agent target
# dirs was half the cost. `rustls-no-provider` enables the same `__rustls` and
# `rustls-platform-verifier` and simply leaves provider selection to us; we
# install `ring` via `lodestone_auth::install_crypto_provider()`.
#
# The catch, and the reason this needs the `rustls` entry below rather than just
# a feature swap: with no provider installed, reqwest's own
# `default_rustls_crypto_provider()` is a `panic!` under
# `#[cfg(not(feature = "__rustls-aws-lc-rs"))]`, fired from `Client::build()`.
# That is a RUNTIME panic, so no `cargo check` can see a missing install.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "form",
    "rustls-no-provider",
    "http2",
    "charset",
] }
# The crypto provider for the above, named directly so we can install it as the
# process default. `default-features = false` is load-bearing twice over:
# rustls' own `default` is `["aws_lc_rs", "logging", "prefer-post-quantum",
# "std", "tls12"]`, and `prefer-post-quantum` *also* enables `aws_lc_rs` — so
# either of those two features anywhere in the graph drags the C build back in
# through feature unification. `std` + `tls12` mirror what reqwest itself asks
# for, so the only delta from reqwest's own request is `ring` in place of
# `aws-lc-rs`.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
# SRV record resolution (`_minecraft._tcp.<host>`) for real servers behind a
# service record. Native-only (needs UDP sockets).
hickory-resolver = "0.26"
# OS credential store (macOS Keychain / Windows Credential Manager / Linux
# Secret Service) for the Microsoft refresh token, keyed per-profile-UUID so
# multiple accounts coexist (issue #64). Default `v1` feature auto-selects the
# right backend per target (`apple-native-keyring-store` on macOS/iOS,
# `windows-native-keyring-store` on Windows, `zbus-secret-service-keyring-store`
# — pure-Rust, no libdbus — elsewhere); each is itself target-gated in
# `keyring`'s own manifest, so this pulls in nothing platform-specific on the
# wrong OS. Native-only: no wasm32 backend exists (nor would one make sense —
# a browser build has no OS keychain to reach).
keyring = "4.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
# Debug info in release, for `samply`/`Instruments` profiling.
#
# **This does not change the generated code.** `debug` controls what DWARF is
# emitted alongside the machine code; optimisation level, LTO and codegen-units
# are what decide performance, and all three are untouched above. The only costs
# are a larger binary and a longer link.
#
# `2` rather than `1` on purpose: with `lto = "thin"` and one codegen unit,
# almost everything hot is inlined, and level 1 (line tables only) attributes a
# sample to the *outer* function — so a mesher inner loop shows up as whatever
# called it. Level 2 keeps inline frames, which is the difference between "time
# is in meshing" and knowing which part of meshing.
debug = 2

# Dev/test profile: measured 2026-08-04, full numbers and the honest limits in
# docs/build-caching.md. Backtraces keep file:line (that is what
# line-tables-only preserves); dep frames lose line info, which is the trade.
[profile.dev]
debug = "line-tables-only"

# Dependencies only — cargo's `"*"` matches non-workspace packages, so
# workspace crates keep line tables above while deps drop debuginfo entirely
# and get light optimisation. Measured: −45% target-dir size and 1.39× faster
# render-suite runtime, against a 2.07× one-time cold dep compile paid once
# machine-wide and then served from sccache. `debug-assertions` is
# deliberately untouched everywhere: correctness gates depend on it.
[profile.dev.package."*"]
debug = false
opt-level = 1

# The 144-chunk sweep (worldgen_data::tests::
# served_columns_never_carry_an_unported_badlands_variant) measured 203.42s →
# 27.13s from this one line, attribution isolated. The trade: worldgen's own
# incremental edit loop is slower per edit (unmeasured); override locally with
# --config 'profile.dev.package.lodestone-worldgen.opt-level=0' if iterating
# inside the crate and it bites.
[profile.dev.package.lodestone-worldgen]
opt-level = 2
