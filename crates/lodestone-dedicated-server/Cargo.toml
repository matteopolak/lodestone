[package]
name = "lodestone-dedicated-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A standalone, headless dedicated server binary over lodestone-server — server.properties, eula.txt, an admin console and clean shutdown, no client crate in the graph."

[lints]
workspace = true

[features]
default = []
jvm = ["dep:lodestone-jvm-bridge"]

# The whole point of splitting this crate off `lodestone-server` (a library
# only, no `[[bin]]`) rather than adding a `[[bin]]` target there: that crate
# also compiles for `wasm32-unknown-unknown` as part of the browser bundle
# (see its own `Cargo.toml`), and a binary target pulling in `tokio`'s
# `rt-multi-thread`/`signal` and a real `TcpListener` would either have to be
# `cfg`-gated off wasm32 inside a library crate (fragile — see this repo's own
# wasm-hazard record for how easily a `cfg` gate goes stale) or would simply
# fail that target outright. A separate crate needs no gate at all: it is
# never a dependency of `lodestone-shell`, `lodestone-render` or the browser
# bundle, so nothing there ever tries to build it for wasm32.
[[bin]]
name = "lodestone-server"
path = "src/main.rs"

[dependencies]
lodestone-jvm-bridge = { path = "../plugins/lodestone-jvm-bridge", optional = true, features = ["jvm"] }
lodestone-server = { path = "../lodestone-server" }
# The `ServerProtocol` to host, reached through the registry rather than by
# naming a version crate directly.
#
# This crate used to depend on `lodestone-v26-2` and construct
# `V770ServerProtocol` by name. That is a required shared -> version edge, and
# `cargo xtask check-isolation` fails on it: a version family must stay
# deletable as a single folder plus a feature line, and a required edge from a
# crate outside `crates/protocol/` makes it undeletable. `lodestone-registry`
# is the *one* crate allowed to name versions, through optional feature-gated
# edges, so a consumer that needs a concrete family asks it for one — exactly
# as `lodestone-shell`'s singleplayer launch does.
#
# 26.2 remains the only family implementing `ServerProtocol` (`Family` and
# `ServerFamily` are two tables for exactly that reason), so `v26-2` is the
# feature enabled here; that is a *manifest* line the deletion procedure
# already removes, not a code dependency. `main` never spells the family:
# it asks `server_protocol_for_protocol` and reports when the answer is
# `None`.
lodestone-registry = { workspace = true, features = ["v26-2"] }
# `has_joined`'s crypto-provider install, required once before the first
# `reqwest` TLS call online-mode makes — the same requirement
# `lodestone-server`'s own `[target.'cfg(not(target_arch = "wasm32"))'.dependencies]`
# comment names for `lodestone-auth`/`reqwest` there. Native-only in that
# crate for the identical reason it is a plain dependency (not target-gated)
# here: this whole binary is native-only.
lodestone-auth = { workspace = true }
# `OnlineModeConfig::new` takes a `reqwest::Client` by value — the same
# workspace entry `lodestone-server` itself builds `OnlineModeConfig` against,
# so no new TLS/feature configuration enters the graph.
reqwest = { workspace = true }
tokio = { workspace = true, features = ["signal", "io-std"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
