[package]
name = "lodestone-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

# The crate is named `lodestone-shell` so the workspace's `crates/lodestone-*`
# glob picks it up without editing the root manifest, but the artefacts it
# produces are just `lodestone`: the runnable binary and the testable library.
[lib]
name = "lodestone"
path = "src/lib.rs"

[[bin]]
name = "lodestone"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Library seams the shell is a thin client over.
lodestone-client = { workspace = true }
lodestone-ecs = { workspace = true }
# The composed client `App` (`docs/plugin-registration.md`). `Sim::client_app()`
# is `lodestone_app::client_app()` plus this crate's own three plugins, and
# `Sim::new` is that plus `Sim::from_app` — so the shell registers `CorePlugin`
# through the identical function an external consumer calls, and there is no
# private composition path left to drift. Before this edge existed the plugin set
# was closed at compile time (`sim/build.rs` took the `World` and dropped the
# `App`), which is what milestone zero of
# `docs/plans/runtime-plugin-loading.md` exists to fix.
lodestone-app = { workspace = true }
# Direct, in addition to `lodestone-ecs`'s re-export, because bevy's derive
# macros (`#[derive(Component)]`, `#[derive(Resource)]`) emit absolute
# `bevy_ecs::` paths and therefore need the crate name in scope here. Same
# version as `lodestone-ecs` pins, from `[workspace.dependencies]`, so there is
# only ever one `bevy_ecs` in the graph. This is `entities.rs`'s render-side
# component set and its `Extract` system — the shell is where extract lives
# (docs/bevy-migration.md §4.4), precisely so `lodestone-render` stays bevy-free.
bevy_ecs = { workspace = true }
# `json` brings in `recipe_json::CorpusBuilder`, which `resources.rs` uses to
# build the recipe corpus out of `client.jar`'s `data/**` at startup.
lodestone-game = { workspace = true, features = ["json"] }
lodestone-model = { workspace = true }
lodestone-assets = { workspace = true }
lodestone-sound = { workspace = true }
lodestone-world = { workspace = true }
# `Nbt`, for reading a command block's block-entity payload
# (`command_block_source`). No crate between here and it re-exports the type —
# `lodestone-world` holds `BlockEntity::nbt: Nbt` without re-exporting `Nbt`
# itself — so this is a direct edge rather than a path through a neighbour.
lodestone-core = { workspace = true }
lodestone-registry = { workspace = true }
lodestone-entity.workspace = true
# Per-entity-type base hitbox height (issue #100's nametag pass): the same
# jar-derived census `lodestone-physics`/`lodestone-worldgen` consumers use,
# not a guessed offset — see `crates/lodestone-shell/src/gpu/nametag.rs`.
lodestone-data = { workspace = true }
lodestone-render = { path = "../lodestone-render", features = ["window"] }
lodestone-physics = { path = "../lodestone-physics" }
# Vanilla particle simulation (block-break debris, hit fragments). The shell
# owns the join between a particle's block state and its atlas sprite, because
# only it holds both the engine and the baked model set.
lodestone-particle = { workspace = true }
# The wasm-safe controller core, shared with the browser client so movement has
# one implementation. The shell adds only the winit key/mouse mapping on top.
lodestone-controller = { path = "../lodestone-controller" }
lodestone-testsupport = { workspace = true }
# The integrated server hosts the bundled singleplayer overworld generator
# (`lodestone_server::overworld_generator`), which wraps the version-free,
# JVM-verified `lodestone-worldgen` pipeline. Depending on it here is what
# closes the worldgen island: the shell now renders real vanilla shape+surface
# terrain instead of the old sine+hash stand-in. The eventual faithful shape is
# the integrated server streaming chunks over a loopback `Connection`; this
# direct call is structured so that path replaces the call site, not the
# generator (plan §8).
lodestone-server = { path = "../lodestone-server" }
# The status ping behind the multiplayer server list (MOTD, player counts,
# favicon), plus the SRV resolution vanilla performs when no port is pinned.
# Before this edge existed, `lodestone_net::ping` / `resolve` had **no consumer
# anywhere in the workspace** — the only code that pinged a server
# (`lodestone-game/tests/live_server.rs`) hand-rolled the whole handshake over a
# raw `TcpStream`. See `menu/status.rs`.
lodestone-net = { workspace = true }
# Microsoft device-code sign-in and multi-account storage (issue #65/#66):
# `menu/accounts.rs`'s account switcher and `net.rs`'s `connect_online` path
# both need `lodestone_auth` directly, not just through `lodestone_client`'s
# re-export of `Session`/`AuthError` — the switcher drives the interactive
# flow and the keychain-backed store, neither of which `lodestone-client`
# exposes (it only consumes an already-authenticated `Session`).
lodestone-auth = { workspace = true }
# `menu/accounts.rs` builds its own short-lived `reqwest::Client` to drive the
# device-code/refresh calls interactively from the account-switcher screen
# (the same crate `lodestone-auth`'s own chain runs on).
reqwest = { workspace = true }

# **`lodestone-autopilot` is deliberately NOT a dependency here, and must not
# become one — not even `optional = true` behind a feature.** It is a
# pre-implemented *external* plugin: the shipped client does not navigate
# itself, and a user who wants it either clones the repo and adds this line
# back, or — the intended route — builds their own headless bot on
# `lodestone-ecs` + `lodestone-client` and registers `AutopilotPlugin` in an
# `App` they own. See `docs/autonomous-navigation.md`'s "Not wired into the
# shell" section for both routes and for what `Sim` can and cannot host.
#
# The autopilot's own gates live with the plugin
# (`crates/plugins/lodestone-autopilot/tests/drives_to_goal.rs`), drive a real
# `GameTick` schedule, and assert real displacement on jar-derived collision —
# so nothing about its correctness depended on the shell registering it.

# GPU / windowing / math.
wgpu = { workspace = true }
winit = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }

# Async runtime for the live client, logging, errors, ids.
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# Cross-platform resident-set-size (RSS) reader for the debug overlay's memory
# gauge. Wraps the platform syscall (task_info on macOS, /proc on Linux) so the
# shell stays within the workspace's `deny(unsafe_code)` — the unsafe FFI lives
# in the dependency, not here. A zero-reading gauge is worse than none (§12).
memory-stats = "1"
# Writes `key.screenshot`'s PNG (issue #16, `src/screenshot.rs`). **A normal
# dependency, not a dev one** — it was `[dev-dependencies]` while its only use
# was encoding genuine PNG streams as *input* to the favicon-mosaic tests, and
# `docs/keybindings.md` recorded it as already shippable, which it was not. Test
# targets see normal dependencies too, so those fixtures are unaffected.
png = { workspace = true }

[dev-dependencies]
# Same pin as every other bench site in the workspace. `default-features = false`
# is load-bearing: it drops plotters and criterion's own rayon.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# Entity tick throughput and interpolation cost (issues #97/#99). CPU-only: no
# GPU adapter, no window, no server. Must stay free of anything version-gated so
# `--no-default-features` keeps working.
[[bench]]
name = "entity_tick"
harness = false

[features]
# `live` compiles the vanilla-26.2 (protocol 776) family into the registry so
# `--connect`/`--live` can resolve an adapter. The shell still names no version in
# code — only the feature name selects a family, and that property is unchanged by
# `live` being on by default.
#
# **On by default because off was a silent failure.** Without it the client still
# starts, still renders, and reports a plausible `chunks=169` while whispering
# `no version family compiled in for protocol 776` into the log — so a forgotten
# flag looked like a working game with a broken server. `CLAUDE.md` carried a rule
# about remembering the flag; making it the default deletes the trap instead of
# documenting it.
#
# The cost is that a default build no longer proves the shell compiles with **no**
# version family, which is the version seam's whole point. That is now checked
# explicitly instead — `cargo check -p lodestone-shell --no-default-features` is in
# `CLAUDE.md`'s health checks. Keep it there; it is the only thing standing between
# the seam and a hardcoded `v770` dependency creeping into shell code.
default = ["live"]
live = ["lodestone-registry/v770"]
