[package]
name = "lodestone-game"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Version-free Minecraft client game-state layer: inventory, crafting, scoreboard, tab list, and HUD state."

[dependencies]
lodestone-model = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true, optional = true }
# Live-oracle-only, feature-gated dependencies. These are SHARED infrastructure
# crates (wire primitives + the transport), never version crates, so enabling
# them cannot break version isolation (`cargo xtask check-isolation` stays
# clean). The live reconciliation test hand-drives the protocol-776 handshake
# with these plus a handful of documented, test-local packet-id constants, so it
# depends on no `crates/protocol/*` family and deleting one wouldn't touch it.
lodestone-core = { workspace = true, optional = true }
lodestone-net = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
# Used only by the live end-to-end tests, which drive the *real* high-level
# client and assert through its public `ClientHandle` API. `lodestone-registry`
# is a version-free shared crate (it aggregates version families behind optional
# features), so this crate still never names a `crates/protocol/*` family and
# isolation stays clean. NOTE: `lodestone-client` itself is a **dev-dependency**
# (below), not a normal optional dep — see the rationale there.
lodestone-registry = { workspace = true, optional = true }

[features]
# JSON loading of recipes/tags from Mojang generated data. Off by default so the
# hermetic build carries no JSON dependency; enabled by the corpus test.
json = ["dep:serde_json"]
# Wires the predict->click->reconcile oracle against a live vanilla 26.2 server.
# Off by default so `cargo test` stays hermetic and version-free; the test is
# additionally `#[ignore]`d.
live-reconcile = ["dep:lodestone-core", "dep:lodestone-net", "dep:tokio"]
# The `live-*` client oracles below drive the *real* client. `lodestone-client`
# is a dev-dependency (see `[dev-dependencies]`), so these features do NOT list
# `dep:lodestone-client` — they only turn on the registry + tokio and enable the
# client's `live-v770` family so the real v770 adapter is available to the test.
# `lodestone-game` still names no version crate, so isolation stays clean.
#
# Wires the tab list end-to-end through the real client and asserts the server's
# `player_info_update` reaches `ClientHandle::players()`. `#[ignore]`d.
live-tablist = [
    "dep:lodestone-registry",
    "dep:tokio",
    "lodestone-client/live-v770",
]
# Wires scoreboard, teams and boss bar end-to-end through the real client via
# RCON `/scoreboard`, `/team`, `/bossbar`, then asserts through
# `ClientHandle::scoreboard()` / `boss_bars()`. `#[ignore]`d.
live-scoreboard = [
    "dep:lodestone-registry",
    "dep:tokio",
    "lodestone-client/live-v770",
]
# Wires an inventory mutation end-to-end through the real client: seed a held
# item over RCON, assert it reaches our `Menu` via the real `ClientEvent` stream
# (clientbound), then send a real `ContainerClick`/`DropSelectedItem` via
# `ClientHandle::send_action` and assert the server's authoritative response
# matches the click machine's prediction (serverbound). `#[ignore]`d.
live-inventory = [
    "dep:lodestone-registry",
    "dep:tokio",
    "lodestone-client/live-v770",
]
# Wires block breaking end to end through the real client against the SURVIVAL
# oracle (:25565, RCON :25566): drive `ClientAction::BlockAction` start/stop via
# `ClientHandle::send_action`, then assert the server reports the block as air
# (read over RCON — server truth, not our prediction). Also gates the vanilla
# break-*timing* (stone bare-handed vs a diamond pickaxe, and instant break on
# START). `#[ignore]`d.
live-mining = [
    "dep:lodestone-registry",
    "dep:tokio",
    "lodestone-client/live-v770",
]
# Wires chat/system-message component resolution end to end through the real
# client against the SURVIVAL oracle: trigger a real death-by-mob over RCON,
# capture the server's `system_chat` component via the real `ClientEvent` stream,
# resolve it against the *real* vanilla `en_us.json` (read from the downloaded
# `client.jar` via `lodestone-assets`, a dev-dep), and assert the wording matches
# vanilla. The pre-fix raw-key output is captured as the negative control.
# `#[ignore]`d.
live-chat = [
    "dep:lodestone-registry",
    "dep:tokio",
    "lodestone-client/live-v770",
]
# Wires block placement / item use end to end through the real client against
# the SURVIVAL oracle (:25565, RCON :25566): seed a block item, drive
# `Placement::use_on` -> `ClientAction::UseItemOn` via `ClientHandle::send_action`,
# then assert the server reports the placed block at the predicted position (read
# over RCON on a force-loaded chunk — server truth, not our prediction). Also
# gates a rejected placement rolling back and the sneak-vs-interact ordering.
# `#[ignore]`d.
live-place = [
    "dep:lodestone-registry",
    "dep:tokio",
    "lodestone-client/live-v770",
]

[dev-dependencies]
serde_json = { workspace = true }
lodestone-testsupport = { workspace = true }
# `lodestone-client` is a **dev-dependency**, not a normal dependency, and this
# is load-bearing architecture, not a convenience. `lodestone-game` is the
# version-free game-state layer: it folds `lodestone_model::ClientEvent`s into
# game state and must be depend-able *by* the client/shell, never the reverse.
# A normal `game -> client` edge makes `client -> game` look circular from the
# client's side, which is exactly what pushed a *duplicate* scoreboard fold into
# `lodestone-client`. `lodestone-client` is only needed to drive the live oracle
# tests, so it belongs here: dev-deps do not count toward the dependency cycle,
# so `lodestone-client`/`lodestone-shell` can now depend on this crate cleanly.
lodestone-client = { workspace = true }
# Used only by the live chat oracle to load the *real* vanilla `en_us.json` from
# the downloaded `client.jar` (via `ZipSource` + `Language`), so the expected
# wording originates from a real asset rather than a table we typed ourselves.
# A dev-dep, so normal builds of this version-free crate never link the asset
# layer and isolation stays clean.
lodestone-assets = { workspace = true }
# Used only by the live oracle tests to surface the driver's internal tracing
# (e.g. a fatal "adapter rejected packet" with its packet id) to stderr.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
