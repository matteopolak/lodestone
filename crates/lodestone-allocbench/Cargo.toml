[package]
name = "lodestone-allocbench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "allocbench"
path = "src/main.rs"

# One global allocator per binary, selected at compile time by exactly one of
# these features. `alloc-system` is the implicit default (no crate pulled in).
# Enabling more than one non-system allocator is a compile error (see main.rs).
[features]
default = ["alloc-system"]
alloc-system = []
alloc-mimalloc = ["dep:mimalloc"]
alloc-snmalloc = ["dep:snmalloc-rs"]
alloc-jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
# Real chunk storage, so the "realistic" workload churns the actual paletted
# containers / nibble light arrays the game allocates — not a byte-`Vec` proxy.
# This crate pulls only lodestone-core + thiserror (no allocator, wasm-neutral),
# so depending on it here cannot leak an allocator choice into any shipped crate.
lodestone-world = { workspace = true }

mimalloc = { version = "0.1.52", optional = true }
snmalloc-rs = { version = "0.7.4", optional = true }
tikv-jemallocator = { version = "0.7.0", optional = true }
