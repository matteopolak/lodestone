[package]
name = "lodestone-testsupport"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lodestone-core.workspace = true
# For `directives::assert_emits_set` — an order-tolerant assertion over
# `Vec<Directive>`/`ClientEvent`, both defined here. Already a normal
# (non-dev) dependency of every crate that would call it (adapters, the
# client driver, the shell), so this adds no new dependency edge.
lodestone-model.workspace = true
tokio.workspace = true
# The synthetic bench/test fixtures in `bench_fixtures` build an
# ordinary `lodestone_world::ChunkColumn` -- already a normal (non-dev)
# dependency of most consumers of this crate, so this adds no new dependency
# edge to anything that already links `lodestone-shell`.
lodestone-world = { workspace = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = []
bench-record = ["dep:serde_json", "dep:libc"]
