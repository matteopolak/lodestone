[package]
name = "lodestone-world"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lodestone-core = { workspace = true }
thiserror = { workspace = true }
# `sign_text`'s message lines arrive as JSON-encoded text-component strings
# (see that module's doc) — a real dependency, promoted from the dev-only
# entry this crate's tests/benches used to be the sole user of.
serde_json = { workspace = true }

[dev-dependencies]
# Issue #80's shared bench/test terrain fixture (`bench_fixtures::
# synthetic_overworld_column`), reused here by `tests/memory.rs` and
# `benches/light_propagation.rs` in place of each file's own hand-rolled
# `realistic_terrain_column` duplicate. Plain default features only (no
# `worldgen`): both call sites use the fast synthetic tier, not the real
# generator. `lodestone-testsupport` is already a *normal* (non-dev)
# dependency of `lodestone-shell` and depends on `lodestone-world` itself
# (normal dep, not dev) -- a dev-dependency cycle back from here is fine
# (Cargo only forbids cycles in the normal/library graph; this edge only
# ever compiles for this crate's own test/bench targets).
lodestone-testsupport = { workspace = true }
# Path dev-dependency, test-only: `tests/pool_footprint.rs` (issue #362) needs
# real, JVM-verified overworld terrain rather than hand-built uniform sections
# to measure the chunk-memory-pool question honestly. `lodestone-worldgen` has
# no dependency on `lodestone-world` (confirmed before adding this — see the
# doc comment at the top of that test), so this edge closes no cycle; it only
# ever compiles for this crate's own test/bench targets, never for the
# `lodestone-world` library itself or for anything that depends on it.
lodestone-worldgen = { path = "../lodestone-worldgen" }
# Direct dependency (not a workspace alias), per the harness decision in
# `docs/roadmap/benchmarks.md`: pure in-memory, no-GPU benches use criterion
# for its statistically-robust sampling and free local `--baseline` diffing.
# `default-features = false` + only `cargo_bench_support`: the default feature
# set pulls in `plotters` (HTML report charts) and `rayon`, neither of which
# this crate's benches need — see the matching note in
# `lodestone-worldgen/Cargo.toml`. Dev-only.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Issue #151's resident-set growth over a synthetic session. In-process RSS
# sampling: the same OS counter `/usr/bin/time -l` reports, but sampled per churn
# cycle inside one run rather than once per process, and with no output parsing.
# Already in the lockfile via `lodestone-shell`. Dev-only.
memory-stats = "1"

[[bench]]
name = "chunk_load"
harness = false

[[bench]]
name = "heightmap_decode"
harness = false

[[bench]]
name = "light_propagation"
harness = false

[[bench]]
name = "light_application"
harness = false

[[bench]]
name = "memory_footprint"
harness = false

[[bench]]
name = "session_rss"
harness = false
