[package]
name = "lodestone-world"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lodestone-core = { workspace = true }
thiserror = { workspace = true }
# `sign_text`'s message lines arrive as JSON-encoded text-component strings
# (see that module's doc) — a real dependency, promoted from the dev-only
# entry this crate's tests/benches used to be the sole user of.
serde_json = { workspace = true }

[dev-dependencies]
# Path dev-dependency, test-only: `tests/pool_footprint.rs` (issue #362) needs
# real, JVM-verified overworld terrain rather than hand-built uniform sections
# to measure the chunk-memory-pool question honestly. `lodestone-worldgen` has
# no dependency on `lodestone-world` (confirmed before adding this — see the
# doc comment at the top of that test), so this edge closes no cycle; it only
# ever compiles for this crate's own test/bench targets, never for the
# `lodestone-world` library itself or for anything that depends on it.
lodestone-worldgen = { path = "../lodestone-worldgen" }
# Direct dependency (not a workspace alias), per the harness decision in
# `docs/roadmap/benchmarks.md`: pure in-memory, no-GPU benches use criterion
# for its statistically-robust sampling and free local `--baseline` diffing.
# `default-features = false` + only `cargo_bench_support`: the default feature
# set pulls in `plotters` (HTML report charts) and `rayon`, neither of which
# this crate's benches need — see the matching note in
# `lodestone-worldgen/Cargo.toml`. Dev-only.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "chunk_load"
harness = false

[[bench]]
name = "heightmap_decode"
harness = false

[[bench]]
name = "light_propagation"
harness = false
