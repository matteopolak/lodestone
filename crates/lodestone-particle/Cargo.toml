[package]
name = "lodestone-particle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The workspace's one portable clock seam — see `lodestone_time`'s crate docs. It
# is here because `Instant::now()` and `SystemTime::now()` COMPILE for wasm32 and
# then TRAP at runtime (measured, executed in a wasm VM: `RuntimeError:
# unreachable`), and this crate runs in the browser. Not a direct `web-time`
# dependency any more: `lodestone-time` is the one crate that depends on `web-time`
# directly, so every other crate's clock goes through it instead of an improvised
# copy. See `docs/browser-shell-port.md`.
lodestone-time = { workspace = true }
# Collision only. Particles resolve movement with `Entity.collideBoundingBox`,
# which is the same swept-AABB code the player uses minus the auto-step, so this
# reuses it rather than growing a second, silently-diverging copy.
lodestone-physics = { workspace = true }
