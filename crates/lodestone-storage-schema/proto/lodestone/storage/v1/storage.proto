syntax = "proto3";

package lodestone.storage.v1;

// The outer record version changes only for incompatible storage-record
// semantics. New optional fields within this version retain their field number.
message StorageRecord {
  uint32 format_version = 1;

  oneof record {
    ChunkRecord chunk = 10;
    GeneralRecord general = 11;
  }
}

// A column is independently replaceable. Palette entries are canonical numeric
// block-state IDs, and block_state_indices is the packed bit stream selected by
// palette_bits; neither representation carries registry strings.
message ChunkRecord {
  sint32 column_x = 1;
  sint32 column_z = 2;
  uint32 game_data_version = 3;
  repeated ChunkSection sections = 4;
  // The complete 4x4x4 biome container for each 16-row block section. Built-in
  // biome values are enum discriminants, never resource-location strings.
  repeated BiomeSection biome_sections = 5;
  // The 4x4 surface-biome answer used by surface-facing consumers. It is kept
  // separately because it is not always the top row of the 3-D container.
  repeated BuiltinBiome surface_biome_ids = 6 [packed = true];
  // The optional 16x16 MOTION_BLOCKING heightmap in stored `top_y + 1` form,
  // indexed by `local_x + local_z * 16`. An absent map means the source had no
  // retained answer; a present map must have exactly 256 unsigned 16-bit values.
  repeated uint32 motion_blocking_heights = 7 [packed = true];
  // Complete named-NBT roots for the resident block entities. Position and type
  // stay inside the NBT tree so opaque entries retain every field this build
  // does not simulate; readers must reject malformed roots or roots outside
  // this column rather than silently dropping them.
  repeated bytes block_entity_nbt = 8;
  // Block and fluid queues stay distinct because they have different drain
  // phases. The absolute trigger, priority and insertion order reconstruct
  // the scheduler's complete ordering key.
  repeated ScheduledTick block_scheduled_ticks = 9;
  repeated ExtensionValue extensions = 10;
  repeated ScheduledTick fluid_scheduled_ticks = 11;
}

// Only built-in server actions have a native representation. Custom actions
// have no lossless decoder in this format and must be rejected by its adapter.
message ScheduledTick {
  sint32 x = 1;
  sint32 y = 2;
  sint32 z = 3;
  ScheduledTickKind kind = 4;
  uint64 trigger_tick = 5;
  ScheduledTickPriority priority = 6;
  uint64 insertion_order = 7;
}

enum ScheduledTickKind {
  SCHEDULED_TICK_KIND_UNSPECIFIED = 0;
  SCHEDULED_TICK_KIND_FLUID = 1;
  SCHEDULED_TICK_KIND_TORCH = 2;
  SCHEDULED_TICK_KIND_REPEATER = 3;
  SCHEDULED_TICK_KIND_COMPARATOR = 4;
  SCHEDULED_TICK_KIND_OBSERVER = 5;
  SCHEDULED_TICK_KIND_TARGET_DECAY = 6;
  SCHEDULED_TICK_KIND_TRIPWIRE_RECHECK = 7;
  SCHEDULED_TICK_KIND_PISTON = 8;
  SCHEDULED_TICK_KIND_GRAVITY = 9;
  SCHEDULED_TICK_KIND_FIRE = 10;
  SCHEDULED_TICK_KIND_TNT_PRIME = 11;
  SCHEDULED_TICK_KIND_COMMAND_BLOCK = 12;
  SCHEDULED_TICK_KIND_BUTTON_RELEASE = 13;
  SCHEDULED_TICK_KIND_DISPENSER_FIRE = 14;
}

enum ScheduledTickPriority {
  SCHEDULED_TICK_PRIORITY_NORMAL = 0;
  SCHEDULED_TICK_PRIORITY_EXTREMELY_HIGH = 1;
  SCHEDULED_TICK_PRIORITY_VERY_HIGH = 2;
  SCHEDULED_TICK_PRIORITY_HIGH = 3;
  SCHEDULED_TICK_PRIORITY_LOW = 4;
  SCHEDULED_TICK_PRIORITY_VERY_LOW = 5;
  SCHEDULED_TICK_PRIORITY_EXTREMELY_LOW = 6;
}

message ChunkSection {
  sint32 section_y = 1;
  uint32 palette_bits = 2;
  repeated uint32 palette_state_ids = 3 [packed = true];
  bytes block_state_indices = 4;
  bytes sky_light = 5;
  bytes block_light = 6;
}

// One 16-row block section's 4x4x4 biome cells in `(qy * 4 + qz) * 4 + qx`
// order. `quart_rows` is four for a full section and narrows only the final
// partial section of a dimension.
message BiomeSection {
  sint32 section_y = 1;
  uint32 quart_rows = 2;
  repeated BuiltinBiome biome_ids = 3 [packed = true];
}

// Stable built-in biome discriminants for this game-data version. Extension
