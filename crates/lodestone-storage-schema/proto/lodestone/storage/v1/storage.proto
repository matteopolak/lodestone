  BUILTIN_BIOME_SAVANNA_PLATEAU = 44;
  BUILTIN_BIOME_SMALL_END_ISLANDS = 45;
  BUILTIN_BIOME_SNOWY_BEACH = 46;
  BUILTIN_BIOME_SNOWY_PLAINS = 47;
  BUILTIN_BIOME_SNOWY_SLOPES = 48;
  BUILTIN_BIOME_SNOWY_TAIGA = 49;
  BUILTIN_BIOME_SOUL_SAND_VALLEY = 50;
  BUILTIN_BIOME_SPARSE_JUNGLE = 51;
  BUILTIN_BIOME_STONY_PEAKS = 52;
  BUILTIN_BIOME_STONY_SHORE = 53;
  BUILTIN_BIOME_SULFUR_CAVES = 54;
  BUILTIN_BIOME_SUNFLOWER_PLAINS = 55;
