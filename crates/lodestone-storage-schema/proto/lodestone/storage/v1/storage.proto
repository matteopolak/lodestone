  BUILTIN_BIOME_THE_END = 58;
  BUILTIN_BIOME_THE_VOID = 59;
  BUILTIN_BIOME_WARM_OCEAN = 60;
  BUILTIN_BIOME_WARPED_FOREST = 61;
  BUILTIN_BIOME_WINDSWEPT_FOREST = 62;
  BUILTIN_BIOME_WINDSWEPT_GRAVELLY_HILLS = 63;
  BUILTIN_BIOME_WINDSWEPT_HILLS = 64;
  BUILTIN_BIOME_WINDSWEPT_SAVANNA = 65;
  BUILTIN_BIOME_WOODED_BADLANDS = 66;
