  BUILTIN_BIOME_COLD_OCEAN = 7;
  BUILTIN_BIOME_CRIMSON_FOREST = 8;
  BUILTIN_BIOME_DARK_FOREST = 9;
  BUILTIN_BIOME_DEEP_COLD_OCEAN = 10;
  BUILTIN_BIOME_DEEP_DARK = 11;
  BUILTIN_BIOME_DEEP_FROZEN_OCEAN = 12;
  BUILTIN_BIOME_DEEP_LUKEWARM_OCEAN = 13;
  BUILTIN_BIOME_DEEP_OCEAN = 14;
  BUILTIN_BIOME_DESERT = 15;
  BUILTIN_BIOME_DRIPSTONE_CAVES = 16;
  BUILTIN_BIOME_END_BARRENS = 17;
  BUILTIN_BIOME_END_HIGHLANDS = 18;
  BUILTIN_BIOME_END_MIDLANDS = 19;
  BUILTIN_BIOME_ERODED_BADLANDS = 20;
  BUILTIN_BIOME_FLOWER_FOREST = 21;
  BUILTIN_BIOME_FOREST = 22;
  BUILTIN_BIOME_FROZEN_OCEAN = 23;
  BUILTIN_BIOME_FROZEN_PEAKS = 24;
  BUILTIN_BIOME_FROZEN_RIVER = 25;
  BUILTIN_BIOME_GROVE = 26;
  BUILTIN_BIOME_ICE_SPIKES = 27;
  BUILTIN_BIOME_JAGGED_PEAKS = 28;
  BUILTIN_BIOME_JUNGLE = 29;
  BUILTIN_BIOME_LUKEWARM_OCEAN = 30;
  BUILTIN_BIOME_LUSH_CAVES = 31;
  BUILTIN_BIOME_MANGROVE_SWAMP = 32;
  BUILTIN_BIOME_MEADOW = 33;
  BUILTIN_BIOME_MUSHROOM_FIELDS = 34;
  BUILTIN_BIOME_NETHER_WASTES = 35;
  BUILTIN_BIOME_OCEAN = 36;
  BUILTIN_BIOME_OLD_GROWTH_BIRCH_FOREST = 37;
