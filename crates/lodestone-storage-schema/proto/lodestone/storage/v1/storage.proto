// General state is typed rather than a string-keyed property map. Future
// built-in records are added as new GeneralRecord oneof members.
message GeneralRecord {
  oneof record {
    WorldProperties world_properties = 1;
    PlayerRecord player = 2;
    EntityRecord entity = 3;
  }
  repeated ExtensionValue extensions = 10;
}

message WorldProperties {
  uint32 game_data_version = 1;
  sint64 seed = 2;
  BuiltinDimension spawn_dimension = 3;
  sint32 spawn_x = 4;
  sint32 spawn_y = 5;
  sint32 spawn_z = 6;
  uint64 day_time = 7;
  GameMode default_game_mode = 8;
}

message PlayerRecord {
  bytes player_uuid = 1;
  BuiltinDimension dimension = 2;
  sint32 x_fixed = 3;
  sint32 y_fixed = 4;
  sint32 z_fixed = 5;
  sint32 yaw_millidegrees = 6;
  sint32 pitch_millidegrees = 7;
}

message EntityRecord {
  // Retained only to keep the original unconsumed vocabulary wire-compatible.
  // The native adapter never reads or writes these registry-local fields.
  uint64 entity_id = 1 [deprecated = true];
  uint32 entity_type_id = 2 [deprecated = true];
  BuiltinDimension dimension = 3;
  sint32 x_fixed = 4 [deprecated = true];
  sint32 y_fixed = 5 [deprecated = true];
  sint32 z_fixed = 6 [deprecated = true];
  // A complete UUID is the durable identity. The native adapter uses these
  // fields instead of the legacy runtime ID and registry ordinal above.
  bytes entity_uuid = 7;
  // Canonical resource key, retained as text because entity-type numeric IDs
  // are registry-local rather than durable storage identities.
  string entity_type = 8;
  // Feet position and look direction retain their live IEEE values exactly.
  // The native adapter rejects non-finite values and verifies the resident
  // column and vertical extent before saving or returning a record.
  double x = 9;
  double y = 10;
  double z = 11;
  float yaw = 12;
  float pitch = 13;
}

enum BuiltinDimension {
  BUILTIN_DIMENSION_UNSPECIFIED = 0;
  BUILTIN_DIMENSION_OVERWORLD = 1;
  BUILTIN_DIMENSION_NETHER = 2;
  BUILTIN_DIMENSION_END = 3;
}

enum GameMode {
  GAME_MODE_UNSPECIFIED = 0;
  GAME_MODE_SURVIVAL = 1;
  GAME_MODE_CREATIVE = 2;
  GAME_MODE_ADVENTURE = 3;
  GAME_MODE_SPECTATOR = 4;
}

// Extension registrations are the one place the format carries names. Core
// records retain only local_id, so an extension payload never repeats its
// namespace or schema label.
message ExtensionTable {
  uint32 table_version = 1;
  repeated RegisteredExtension extensions = 2;
}

message RegisteredExtension {
  uint32 local_id = 1;
  string namespace = 2;
  string name = 3;
  uint32 schema_version = 4;
}

message ExtensionValue {
  uint32 local_id = 1;
  bytes payload = 2;
}
