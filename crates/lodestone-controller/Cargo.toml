# The wasm-safe player-controller core, shared by the native (winit) shell and
# the browser (web-sys) client so movement has exactly one implementation.
#
# Depends only on `lodestone-physics` (bit-exact movement) and `lodestone-client`
# (for the version-free `ClientAction`/`Rotation`/`Vec3` it lowers to). Both are
# wasm-safe: `lodestone-client` gates its tokio `net`/`mio` deps behind
# `cfg(not(target_arch = "wasm32"))`. This crate itself touches no clock, fs,
# net, or thread APIs — the `no_wasm_trap_symbols_are_confined` guard test
# enforces that so the shared pipeline can never quietly regain a wasm trap.
[package]
name = "lodestone-controller"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lodestone-physics = { path = "../lodestone-physics" }
lodestone-client = { workspace = true }
# Stage 2 of docs/bevy-migration.md: the local player's components live in
# `lodestone-ecs` and this crate contributes the `TickSet::Input` /
# `TickSet::Send` systems that read and write them. One-directional by
# construction — `lodestone-client` already depends on `lodestone-ecs`, so the
# reverse edge would be a cycle and `lodestone-ecs` can never name this crate.
lodestone-ecs = { workspace = true }
# `PlayerInput`, the version-free wire shape `send_player_input` queues.
lodestone-model = { workspace = true }
# Direct, in addition to `lodestone-ecs`'s re-export, because bevy's derive
# macros emit absolute `bevy_ecs::` paths and therefore need the crate name in
# scope here. Same `[workspace.dependencies]` pin, so there is only ever one
# `bevy_ecs` in the graph.
bevy_ecs = { workspace = true }
bevy_app = { workspace = true }
tracing = { workspace = true }
