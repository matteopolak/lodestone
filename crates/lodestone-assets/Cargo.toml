[package]
name = "lodestone-assets"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lodestone-model.workspace = true
thiserror.workspace = true
serde_json.workspace = true
zip.workspace = true
png.workspace = true
fontdue.workspace = true
# `java.util.Random`, bit-exact — `entity_models::ghast_model`'s nine tentacle
# lengths are a seeded LCG draw, byte-identical to vanilla. The workspace's one
# copy, shared with `lodestone-particle`, `lodestone-audio`, `lodestone-render`
# and `lodestone-shell`'s enchanting table.
lodestone-javarandom.workspace = true

[dev-dependencies]
lodestone-model.workspace = true
tempfile.workspace = true
png.workspace = true
serde_json.workspace = true
# The unihex gates build a `hex_file` archive in memory, the same way the PNG
# sheet gates encode their sheets with `png`.
zip.workspace = true
# The TTF gates hand-build a minimal valid sfnt in memory (see
# `tests/font_ttf.rs`) and cross-check `fontdue`'s output against
# `ttf-parser`'s independent table reads, so the expected value never comes
# from the code under test.
ttf-parser = "0.25"
