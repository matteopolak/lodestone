[package]
name = "lodestone-worldgen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Version-free Minecraft world-generation engine (RNG, noise, density-function interpreter)."

[lints]
workspace = true

[features]
default = []
# Structural counters through the generation hot path. The counters live in
# `lodestone-worldgen-core`, so this entry only forwards the flag; without the
# forward the parent would compile with the flag set and count nothing.
# `tests/gen_counters_forward.rs` gates that: a non-zero counter through the
# re-export with the feature on, `Snapshot::default()` with it off.
#
# Default off: every hook is an empty `#[inline(always)]` function without it.
# With it on, relaxed atomics sit in the hot path, so a timing run and a
# counter run are separate runs. It changes no arithmetic and no RNG draw.
gen-counters = ["lodestone-worldgen-core/gen-counters"]

[dependencies]
serde = { workspace = true }
# Canonical block-state and face-occlusion facts. The local interner
# resolves each state into this global table once, leaving feature candidate
# loops on numeric ids instead of parsing state text.
lodestone-data = { workspace = true }
serde_json = { workspace = true }
# The numeric core (hash, math, rng, noise, density, counters), re-exported
# wholesale from `src/lib.rs`, so this dependency is invisible to every
# caller. A path dependency
# rather than a `[workspace.dependencies]` alias, matching how `lodestone-server`
# spells its dependency on this crate.
lodestone-worldgen-core = { path = "../lodestone-worldgen-core" }
# Structure templates (`src/structure/template.rs`): the NBT codec (`Nbt`, `Reader`,
# `read_named_nbt`) the 1212 bundled `.nbt` structure templates are written in.
# Reused rather than re-implemented — `lodestone-anvil` already reads chunk NBT
# and `level.dat` through it, so a second decoder here would be a second thing to
# be wrong about modified UTF-8 and list nesting. Version-free and already in
# every build graph this crate is part of, wasm included.
lodestone-core = { workspace = true }
# Structure templates are written as gzip-wrapped NBT, so the
# template reader needs an inflate. Pure-Rust backend (miniz_oxide), already a
# workspace dependency (`lodestone-net`, `lodestone-anvil`).
flate2 = { workspace = true }

# The 26.3 generator (`terrain263`): the bundled data tables and the
# placed-feature decorator every dimension generates with.
lodestone-worldgen-data-26-3 = { path = "../lodestone-worldgen-data-26-3" }
lodestone-worldgen-feature-26-3 = { path = "../lodestone-worldgen-feature-26-3" }

[dev-dependencies]
serde_json = { workspace = true }
# The portable clock seam; `Instant::now()` traps on wasm32, so even a test
# reads the clock through it.
lodestone-time = { workspace = true }
