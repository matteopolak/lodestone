[package]
name = "lodestone-v1-13"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lodestone-core = { workspace = true }
lodestone-data = { workspace = true }
lodestone-macros = { workspace = true }
lodestone-model = { workspace = true }
# Packet definitions measured byte-identical (wire shape and codec) to their
# v1-8/v1-9/v1-14 counterparts; see that crate's module docs for which packets
# and their protocol ranges.
lodestone-protocol-common = { workspace = true }
lodestone-server = { path = "../../lodestone-server" }
lodestone-world = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
lodestone-client = { workspace = true }
lodestone-net = { workspace = true }
lodestone-registry = { path = "../../lodestone-registry", features = ["v1-13"] }
lodestone-testsupport = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
