[package]
name = "lodestone-v26-3"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.lodestone-isolation]
compatibility-base = "lodestone-v26-2"

[lints]
workspace = true

[dependencies]
lodestone-core = { path = "../../lodestone-core" }
lodestone-data = { path = "../../lodestone-data" }
lodestone-model = { path = "../../lodestone-model" }
lodestone-v26-2 = { path = "../26.2" }

[dev-dependencies]
lodestone-client = { workspace = true }
# The hosting seam test resolves the server protocol through the registry, like
# the shell's singleplayer launch; the resulting v26-3 -> registry -> v26-3 edge
# is dev-only.
lodestone-registry = { workspace = true, features = ["v26-3"] }
lodestone-world = { path = "../../lodestone-world" }
lodestone-server = { path = "../../lodestone-server" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
