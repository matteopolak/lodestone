[package]
name = "lodestone-worldgen-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Numeric core of the world-generation engine: hashing, seeded RNG, noise, and the density-function interpreter."

[lints]
workspace = true

[features]
default = []
# Structural counters through the generation hot path (`src/counters.rs`), the
# instrument the worldgen-rewrite acceptance criteria are written in
# (`docs/plans/worldgen-rewrite.md` Unit 1, `docs/render-benchmarks.md`).
#
# **This is the definition; `lodestone-worldgen`'s same-named feature forwards to
# it** (`gen-counters = ["lodestone-worldgen-core/gen-counters"]`). The hook
# bodies and the `#[cfg]`s that select them live here, so a build that enables
# the feature only on the parent and not here would compile fine and count
# nothing — which is why `crates/lodestone-worldgen/tests/gen_counters_forward.rs`
# asserts a non-zero counter through the parent's re-export in both states.
#
# Default OFF and it must stay that way: every hook is an `#[inline(always)]`
# empty function without it, so a shipped build carries no counter code at all.
# With it on, relaxed atomics sit inside `AquiferSystem::block_at` (98,304 calls
# per chunk fill) and `WorldgenRandom::next_bits` — measurably slower, which is
# why a timing run and a counter run are two separate runs, never one.
#
# Additive only: it adds atomics and hook bodies, and touches no arithmetic and
# no RNG draw, so it cannot change generated terrain. `just test` covers both
# settings via `--all-features`.
gen-counters = []
# Adds an optional outermost-stage observer for diagnostic hardware-counter runs.
# It has no effect unless a caller installs an observer at runtime.
stage-pmu = []

[dependencies]
# `density`'s data layer parses noise settings, spline tables and biome/climate
# documents straight from the version crate's JSON.
serde_json = { workspace = true }
# The biome-zoom seed is the first eight bytes of the SHA-256 of the world seed.
sha2 = { workspace = true }
# Canonical field-cell arithmetic uses one token-generic kernel on every backend.
fearless_simd = { workspace = true }
fearless_simd_macros = { workspace = true }

[dev-dependencies]
lodestone-worldgen-data-26-3 = { path = "../lodestone-worldgen-data-26-3" }
fearless_simd = { workspace = true, features = ["force_support_fallback"] }
