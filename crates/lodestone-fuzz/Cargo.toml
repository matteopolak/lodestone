[package]
name = "lodestone-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lodestone-core = { workspace = true }
lodestone-data = { workspace = true }
lodestone-model = { workspace = true }
lodestone-world = { workspace = true }
# Version-family dependencies stay optional so each family remains deletable.
lodestone-v1-8 = { workspace = true, optional = true }
lodestone-v1-9 = { workspace = true, optional = true }
lodestone-v1-14 = { workspace = true, optional = true }
lodestone-v26-2 = { workspace = true, optional = true }
lodestone-v26-3 = { workspace = true, optional = true }
lodestone-net = { workspace = true }
uuid = { workspace = true }
# The integrated server is a direct path dependency because it has no workspace alias.
lodestone-server = { path = "../lodestone-server" }
# RCON framing is needed only by the optional live oracle.
lodestone-testsupport = { workspace = true, optional = true }
proptest = { version = "1", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# Default family features make the ordinary property-test sweep nonempty.
# Remove a deleted family from its dependency, feature and default entries.
default = ["v1-8", "v1-9", "v1-14", "v26-2", "v26-3"]
v1-8 = ["dep:lodestone-v1-8"]
v1-9 = ["dep:lodestone-v1-9"]
v1-14 = ["dep:lodestone-v1-14"]
v26-2 = ["dep:lodestone-v26-2"]
v26-3 = ["dep:lodestone-v26-3"]
# Live RCON support is opt-in; hermetic properties need no network helper.
rcon-oracle = ["dep:lodestone-testsupport"]
differential-campaign = ["rcon-oracle", "dep:proptest", "dep:serde", "dep:serde_json"]

[[bin]]
name = "differential-campaign"
path = "src/bin/differential-campaign.rs"
required-features = ["differential-campaign"]

[dev-dependencies]
# The client-state differential fixture drives the public ClientBuilder through
# an in-memory transport; these stay test-only so fuzz targets keep their
# decoder-focused dependency surface.
lodestone-client = { workspace = true }
tokio = { workspace = true }
# Bounded property tests run without libFuzzer or sanitizer setup.
proptest = "1"
# The density JSON regression exercises malformed worldgen input shapes.
lodestone-worldgen-core = { path = "../lodestone-worldgen-core" }
serde = { workspace = true }
serde_json = { workspace = true }
# Keeps the full captured chunk payload compact on disk. The test restores its
# unmodified bytes before adapter replay, so this is fixture transport rather
# than a production dependency.
base64 = { workspace = true }
flate2 = { workspace = true }
