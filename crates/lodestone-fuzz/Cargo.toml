[package]
name = "lodestone-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lodestone-core = { workspace = true }
lodestone-model = { workspace = true }
lodestone-world = { workspace = true }
# One OPTIONAL dependency per version family, mirroring `lodestone-registry`'s
# shape for the same reason it has that shape: a version family must stay
# deletable as a single folder. These were required edges, and `xtask
# check-isolation` failed on all four — correctly. A required shared -> version
# edge makes the version undeletable, because deleting the family's folder would
# stop this crate building; an optional, feature-gated one makes the deletion
# "remove the folder, then remove this crate's two lines naming it".
#
# Do not name a family's folder PATH in these comments: `xtask check-deletable`
# greps this manifest for references and would report a comment as fallout.
#
# NOT exempted, deliberately. The isolation lint has exactly one exemption, keyed
# on a `[package.metadata.lodestone-isolation] role` and reserved for the version
# registry, and claiming it here would be asserting that a fuzz harness is the
# workspace's version aggregation point. It is not. The lint's *own* soft/hard
# split is the mechanism intended for this case, so this crate uses it and stays
# a surfaced warning rather than a silenced violation.
lodestone-v1-8 = { workspace = true, optional = true }
lodestone-v1-9 = { workspace = true, optional = true }
lodestone-v1-14 = { workspace = true, optional = true }
lodestone-v26-2 = { workspace = true, optional = true }
# Issue #282's own body names this crate's frame-level codec directly
# (`MAX_PACKET_LEN`/`MAX_DECOMPRESSED_LEN`/`MAX_LENGTH_VARINT_BYTES` in
# `codec.rs`) as already bounds-checked "per manual reading" — exactly the
# claim this harness exists to turn into a measurement instead.
lodestone-net = { workspace = true }
uuid = { workspace = true }
# Direct path dep (not a workspace alias), matching `lodestone-v26-2`'s own
# convention for this same crate: `lodestone-server` is not in
# `[workspace.dependencies]`, so every consumer spells the path itself. Used
# only to fuzz `V770ServerProtocol::decode` (issue #282's serverbound half —
# the attack surface our *integrated server* faces from a connecting client,
# distinct from the clientbound decoders every family below covers).
lodestone-server = { path = "../lodestone-server" }
# Track B (issue #549): the differential-fuzzing harness's `RconOracle` drives
# any Source-RCON endpoint (real vanilla or our own `IntegratedServer::start_rcon`)
# through `lodestone_testsupport::RconClient` rather than re-deriving RCON
# framing — `lodestone-sound`'s Cargo.toml already uses this same
# optional-non-dev-dependency shape for the same reason: the type appears in a
# `pub mod` gated by a feature, not only under `#[cfg(test)]`.
lodestone-testsupport = { workspace = true, optional = true }

[features]
# ON BY DEFAULT, unlike `lodestone-registry`'s otherwise-identical feature set,
# and the difference is load-bearing rather than a style choice. This crate's whole
# product is a sweep over `Family::ALL`; off by default, `cargo test --workspace` —
# what CI runs, and what anyone means by "the fuzz tests pass" — would compile an
# EMPTY family list and sweep nothing, while three of the eight test binaries
# vanish entirely behind their own `#![cfg(feature = ...)]`. Coverage that quiet is
# not worth the tidier manifest.
#
# Measured, because the obvious version of this argument overstates it: a
# family-less build does NOT report green. The `no_panic_arbitrary_bytes` sweeps
# fail — one on its own case-count floor (`got 0`), one inside proptest on an empty
# selection range — and `families_are_compiled_in` in that file fails first and
# says why in one line. Read that test's doc comment before changing this.
#
# Deleting a family stays: delete its folder, then delete its `dep:` line above,
# its line here, and its name from `default`.
default = ["v1-8", "v1-9", "v1-14", "v26-2"]
v1-8 = ["dep:lodestone-v1-8"]
v1-9 = ["dep:lodestone-v1-9"]
v1-14 = ["dep:lodestone-v1-14"]
v26-2 = ["dep:lodestone-v26-2"]
# Track B's `differential::rcon::RconOracle` (issue #549). Off by default and
# not folded into `default`, unlike the four family features above: those
# gate *deletability*, this gates an actual network-reaching dependency edge
# that `cargo test --workspace` must not need just to build this crate.
rcon-oracle = ["dep:lodestone-testsupport"]

[dev-dependencies]
# Property-based fuzzing. This comment used to justify proptest over
# `cargo-fuzz` by saying "the toolchain here is 1.95.0 and libFuzzer needs
# nightly" — that is wrong: `rust-toolchain.toml` pins a nightly channel. The
# real reasons are run time and keeping `cargo test --workspace` unaffected; see
# `docs/fuzz-harness.md` for the current version. Pinned to the 1.x line already
# implied by every other `workspace.dependencies` entry using unpinned majors.
proptest = "1"
# Only for density_builder_panics_on_non_object_json.rs, which reports a
# finding from fuzz/fuzz_targets/density_function_json.rs (the widened Track
# A scope, issue #549): `density::Builder::build` panics rather than
# returning `Result` on structurally-malformed JSON. Dev-only because nothing
# else in this crate touches worldgen.
lodestone-worldgen-core = { path = "../lodestone-worldgen-core" }
serde = { workspace = true }
serde_json = { workspace = true }
