[package]
name = "lodestone-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lodestone-core = { workspace = true }
lodestone-model = { workspace = true }
lodestone-world = { workspace = true }
lodestone-v47 = { workspace = true }
lodestone-v340 = { workspace = true }
lodestone-v735 = { workspace = true }
lodestone-v770 = { workspace = true }
# Issue #282's own body names this crate's frame-level codec directly
# (`MAX_PACKET_LEN`/`MAX_DECOMPRESSED_LEN`/`MAX_LENGTH_VARINT_BYTES` in
# `codec.rs`) as already bounds-checked "per manual reading" — exactly the
# claim this harness exists to turn into a measurement instead.
lodestone-net = { workspace = true }
uuid = { workspace = true }
# Direct path dep (not a workspace alias), matching `lodestone-v770`'s own
# convention for this same crate: `lodestone-server` is not in
# `[workspace.dependencies]`, so every consumer spells the path itself. Used
# only to fuzz `V770ServerProtocol::decode` (issue #282's serverbound half —
# the attack surface our *integrated server* faces from a connecting client,
# distinct from the clientbound decoders every family below covers).
lodestone-server = { path = "../lodestone-server" }

[dev-dependencies]
# Property-based fuzzing over stable Rust (the toolchain here is 1.95.0;
# `cargo-fuzz`/libFuzzer need nightly — see `docs/fuzz-harness.md` for why
# this crate does not add one). Pinned to the 1.x line already implied by
# every other `workspace.dependencies` entry using unpinned major versions.
proptest = "1"
