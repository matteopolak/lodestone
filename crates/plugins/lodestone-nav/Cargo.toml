# The version-free autonomous-navigation search core (`docs/baritone-port.md`
# §1.3, §4.0): world view, movement graph, simulated cost model, goals, and the
# resumable search. A plain library — no bevy, no ECS, no async, no threads —
# precisely so it can be gated headlessly against captured chunk regions and a
# live server without a schedule between the oracle and the code it validates.
#
# **Licence.** GPL-3.0-or-later, per
# `docs/baritone-port.md` §1.2 point 2. The design is clean-room (§1.2 point 1):
# it carries no structure, no type names and no constants from any existing
# navigation implementation. Every movement number comes from
# `lodestone-physics`'s `PhysicsProfile` or is *derived by simulating it*.
[package]
name = "lodestone-nav"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[dependencies]
# The integrator and the `CollisionView` seam. Called, never modified: it is
# bit-exact against two independent oracles and this crate must not disturb that
# (`docs/bevy-migration.md` §8).
lodestone-physics = { path = "../../lodestone-physics" }
# `BlockAabb`, `BlockPhysics`/`block_physics`, `VersionAdapter`. Never a version
# crate — that is the whole point of the census reaching us through the seam.
lodestone-model = { workspace = true }
# `Arc<ChunkSection>` copy-on-write snapshots: the mechanism that makes a search
# over an owned world possible with no lock held.
lodestone-world = { workspace = true }
