# A toy MONITOR-tier reader plugin (issues #104/#105/#110): the first, and
# so far only, consumer of `lodestone_ecs::GameEvent`/`GameEventBus`/
# `EventPriority`.
#
# Issue #436's ledger listed this as a declared island. It is no longer one:
# `tests/observes_a_real_session.rs` registers it through the public plugin API
# against a real integrated server. It is still deliberately **not** registered
# in the shipped client — same call, for the same reason, as
# `lodestone-autopilot` (see this crate's lib.rs and `docs/plugin-api.md`).
[package]
name = "lodestone-event-logger"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# `GameEvent`, `GameEventBus`, `GameEventBusPlugin`, `EventPriority`,
# `assert_monitor_system_is_read_only`, `GameTick`. Re-exports
# `bevy_app`/`bevy_ecs` as `lodestone_ecs::{app, ecs}` so this crate's own
# code never has to match either version by hand.
lodestone-ecs = { workspace = true }
# `ClientEvent` — the type `GameEvent` wraps, named directly so this crate can
# store/inspect events without going through `lodestone_ecs::ecs::*` paths.
lodestone-model = { workspace = true }
# Direct, in addition to `lodestone-ecs`'s re-export: `#[derive(Resource)]`/
# `#[derive(Plugin)]`-adjacent code below emits absolute `bevy_ecs::`/
# `bevy_app::` paths, which only resolve if this crate has them as direct
# dependencies too (`docs/plugin-api.md`'s "how to change it" note;
# `crates/plugins/lodestone-autopilot/Cargo.toml` documents the same
# requirement for the same reason). Same `[workspace.dependencies]` pin
# `lodestone-ecs` itself builds against, so there is only ever one
# `bevy_ecs`/`bevy_app` in the graph.
bevy_ecs = { workspace = true }
bevy_app = { workspace = true }

[dev-dependencies]
# --- the real end-to-end transport (issue #436, item 2) -------------------
#
# `tests/observes_a_real_session.rs` proves this plugin observes events that a
# **real server** produced, delivered by the **real** `SharedState::apply` — not
# by a hand-written `World::write_message`. `SharedState::apply` is
# `pub(crate)`, so there is no shortcut: the only way to reach it is an actual
# connection, which is exactly why this dev-dependency set is the size it is.
#
# None of this is a runtime dependency. The plugin itself still depends on
# nothing but `lodestone-ecs`/`lodestone-model`, so it stays version-free and
# embeddable; `cargo xtask check-isolation` sees these as dev edges only.
#
# `client_app()` (the six version-free plugins production composes) and
# `spawn_session` — whose own doc names `ClientBuilder::ecs` as its consumer.
lodestone-app = { workspace = true }
# `ClientBuilder::ecs`/`connect_with` — the public seam a third-party embedder
# registers plugins through, and the one `lodestone_shell::net` uses.
lodestone-client = { workspace = true }
# `memory_pair`, the in-process duplex the integrated server is served over.
lodestone-net = { workspace = true }
# `IntegratedServer::open_in_memory` + `ChunkSource`: a real server on the far
# end, so every observed event originates outside this crate entirely.
# A path dependency rather than `workspace = true`: `lodestone-server` has no
# `[workspace.dependencies]` entry, and every crate that needs it (the shell,
# `lodestone-registry`, `lodestone-v26-2`) names it by path for that reason.
lodestone-server = { path = "../../lodestone-server" }
# The **real** 26.2 wire format, via the designated aggregator rather than by
# naming `lodestone-v26-2` directly. A hand-rolled stand-in protocol pair (the
# shape `lodestone-server/tests/client_integration.rs` uses) would be ~300 lines
# of test-owned codec; this is two constructor calls and is what production
# actually runs. The version-lock is the documented cost, paid in tests only —
# same bargain `lodestone-autopilot`'s `lodestone-data` dev-dependency records.
lodestone-registry = { workspace = true, features = ["v26-2"] }
# `PlayerState`, the one argument `lodestone_app::spawn_session` takes.
lodestone-physics = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
