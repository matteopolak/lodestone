[package]
name = "lodestone-server"
autobenches = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lodestone integrated server (singleplayer + open-to-LAN) over the shared Connection/Transport seam."

[lints]
workspace = true

[features]
default = ["bundled-worldgen-v26_2"]
# Structural counters through the redstone notification/reaction/scheduling
# path — the instrument `docs/plans/redstone-execution-model.md`'s U1 unit
# specifies. See `src/redstone_counters.rs`'s own module doc. Default off,
# additive-only (atomics plus hook bodies), same guarantee
# `lodestone-worldgen-core`'s `gen-counters` makes: enabling it cannot change
# any propagation or scheduling decision, only what gets counted.
redstone-counters = []
# The embedded 26.2 overworld/Nether/End worldgen bundle (`src/worldgen_data.rs`,
# `assets/worldgen/`) — issue #407's version gate. Real, but only a *partial*
# one: this crate's own internal callers (`chunk_store.rs`'s tests,
# `integrated.rs`, `structure_loot.rs`, `world_spawn.rs`, `dimension.rs`,
# `examples/bench_worldgen.rs`, and most of `tests/`) all still call
# `overworld_generator`/`overworld_chunk_source` unconditionally, so turning
# this feature off today breaks this crate's own build, not just a
# downstream one — that migration (routing every internal caller through
# `crate::protocol::ServerProtocol::worldgen_scope` /
# `crate::worldgen_data::bundled_worldgen_serves` first) is real, separate
# work, out of scope for the gate itself. What this feature buys today: the
# data is no longer compiled in with **no** Cargo-level acknowledgement that
# it is 26.2-specific at all — the prior state this issue was filed
# against. Default on, so every existing consumer (`lodestone-shell`,
# `lodestone-v26-2`'s dev-dependency, this crate's own test suite) is
# unaffected; a future non-v770 hosting family, or a build that wants to
# drop the bundle's size, is the one that turns it off.
bundled-worldgen-v26_2 = []

[dependencies]
# The portable clock. Not a direct `web-time` dependency any more:
# `lodestone-time` is the one crate that depends on `web-time` directly, so
# every other crate's clock goes through it instead of an improvised copy. See
# `docs/browser-shell-port.md`. It is needed because `Instant::now()` and
# `SystemTime::now()` COMPILE for wasm32 and then TRAP at runtime (measured,
# executed in a wasm VM: `RuntimeError: unreachable`), and this crate runs in
# the browser: `lodestone-shell`'s browser build reached a world and died here.
lodestone-time = { workspace = true }
# The server's own `bevy_ecs::World` (issue #433, `docs/server-ecs.md`;
# Phase 0 of `docs/plans/server-ecs-migration.md`). Pinned through the same
# `[workspace.dependencies]` entries `lodestone-ecs` already builds against —
# `version = "0.19", default-features = false, features = ["std"]`, so no
# `bevy_reflect` and, load-bearingly, never `multi_threaded`: that omission is
# what keeps this migration free of a second threading model, and it is why
# bevy dispatches these systems as direct calls rather than through a task pool.
#
# Deliberately NOT `lodestone-ecs`, despite `docs/server-ecs.md`'s title. Two
# `World`s means a shared `ScheduleLabel` type buys nothing at runtime, while
# linking that crate would drag the entire *client* vocabulary (`LocalPlayer`,
# `FrameClock`, `SessionMenus`) plus `lodestone-physics`/`-game`/`-world` into
# this graph — and into the browser bundle, which links `lodestone-server` and
# links neither bevy nor `lodestone-ecs` today. The decision record already
# names the substrate/client-vocabulary split as the fix and already calls it a
# follow-up rather than a prerequisite. See `src/ecs/schedules.rs`'s own doc.
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
# The Brigadier argument tree the server's own built-in commands parse against
# (issue #48, `src/commands.rs`). Safe to depend on where `lodestone-ecs` is
# not, and the distinction is the whole reason `src/command.rs`'s seam exists:
# `lodestone-command` has an **empty** `[dependencies]` (see its own
# `Cargo.toml`), so it drags in no ECS, no client vocabulary, no protocol crate
# and nothing new into the browser bundle. It is a parser, not a runtime.
lodestone-command = { workspace = true }
# The Minecraft-flavoured argument types (`McArg`, `GameModeArg`, `EntityArg`,
# `ItemArg`) the built-in command tree is built from. Depends only on
# `lodestone-command`/`-model`/`-data` + `uuid`, all of which are already in this
# graph, so it adds nothing to the browser bundle beyond its own code and names
# no protocol number — see its own `Cargo.toml`.
lodestone-command-mc = { workspace = true }
lodestone-core = { path = "../lodestone-core" }
lodestone-net = { path = "../lodestone-net" }
lodestone-worldgen = { path = "../lodestone-worldgen" }
# The mob simulation (`mobs`) ticks `lodestone-entity`'s goal AI + pathfinder
# over the server's own terrain. `lodestone-entity` depends only on
# `lodestone-model` + `uuid`, so this adds no version/protocol coupling and no
# dependency cycle (entity never depends on server).
lodestone-entity = { path = "../lodestone-entity" }
# `knockback::{knockback_impulse, attack_direction}` — the melee knockback
# velocity mechanic (issue #12). Zero dependencies of its own (see that
# crate's own `Cargo.toml`), so this adds no cycle: `lodestone-entity` does
# not depend on it, only `lodestone-server` reaches for both.
lodestone-physics = { path = "../lodestone-physics" }
lodestone-model = { path = "../lodestone-model" }
# The 26.2 per-block-state game-data censuses (`path_types`, `block_states`,
# `collision_shapes`, ...). This depends on nothing but `lodestone-model` (see
# `docs/lodestone-data-crate.md`), so it is a plain data dependency, not a
# protocol one: `ChunkWorld` (mobs.rs) reads it to classify real block states
# into `PathType`/collision geometry instead of a solid/air guess (issue #204).
lodestone-data = { path = "../lodestone-data" }
# The light engine (`lighting::compute_column_light`) `natural_spawn` runs per
# column, because every monster spawn rule in the game is a light test and this
# crate computed no light at any position. Promoted from the dev-dependency it
# was — step 1 of `docs/server-chunk-light.md`'s brokered patch — and it costs
# nothing in graph terms: `lodestone-world`'s own dependencies are
# `lodestone-core`, `thiserror` and `serde_json`, all already here.
lodestone-world = { path = "../lodestone-world" }
# The version-free crafting matcher and its datapack-JSON loader
# (`recipe::RecipeBook`, `recipe_json`) — issue #529's server-authoritative
# crafting. This crate must NOT grow a second matcher: the client's is already
# version-free game logic, and two independent readings of the recipe format is
# exactly how the two ends drift apart.
#
# This revisits the "keep `lodestone-game` out of this graph" note above, and
# the reason it is now the right call is measurable: `lodestone-game`'s own
# `[dependencies]` are `lodestone-model` + `uuid` (+ optional `serde_json`,
# which this crate already carries), so the browser bundle gains that crate's
# code and no new transitive graph at all. The `json` feature is what the
# bundled corpus loader needs.
lodestone-game = { path = "../lodestone-game", features = ["json"] }
# The gzip wrapper Mojang ships structure templates with. `structure_loot`
# re-reads the raw `.nbt` bytes this crate already embeds, because the parsed
# `StructureTemplate` deliberately drops the per-block NBT the chest markers
# live in. Same crate `lodestone-worldgen` already uses for the same files.
flate2 = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
# `tracing::warn!` in `tick::run_tick_loop`'s overload path (issue #285) — the
# same crate `lodestone-net`/`lodestone-shell` already depend on for logging,
# not a new logging framework. Plain macros, no I/O of its own, so no
# wasm32-specific feature split is needed the way `tokio` above has one.
tracing = { workspace = true }
# Client-supplied login UUID is echoed back in the login-success reply; this is
# a normal (not dev-only) dependency because `ServerBound::LoginStart` and
# `ServerProtocol::login_success` carry a `Uuid` in production code, not just
# tests.
uuid = { workspace = true }

# --- Native (non-wasm) target dependencies ---
# Native tokio keeps the full workspace feature set (including `net` and
# `rt-multi-thread`); `IntegratedServer::bind`'s TCP path is `cfg`-gated to this
# target. Splitting the dependency by target is a build-configuration change
# only — native behaviour is byte-for-byte unchanged.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
# World persistence (issue #437): the `.mca` region container and `level.dat`.
# **Target-gated deliberately.** `lodestone-anvil`'s readers and writers are
# `std::fs`-based, and this crate is one of the few that really does build for
# `wasm32-unknown-unknown` (see the tokio split above and `open_in_memory`'s
# browser use). A browser singleplayer world has no filesystem to save to, so
# the whole `region_source` module is `cfg`-gated off there rather than
# compiled against a filesystem that would fail at runtime.
lodestone-anvil = { path = "../lodestone-anvil" }
# Issue #273's online-mode half: `has_joined`, the server-side session-server
# check, and the `AuthError` type `ServerError::AuthServiceUnavailable` wraps.
# Target-gated for the same reason as `lodestone-anvil` above and as
# `lodestone-auth`'s own native-only modules: the session-server call is an
# HTTPS request through `reqwest`, and a browser singleplayer world never
# reaches online mode (there is no server to authenticate to).
lodestone-auth = { path = "../lodestone-auth" }
# The HTTP client type `OnlineModeConfig::http` carries and
# `lodestone_auth::has_joined` takes. Same workspace entry (and same
# `rustls-no-provider` + `install_crypto_provider` requirement) `lodestone-auth`
# itself already builds against — see that crate's `tls` module.
reqwest = { workspace = true }

# --- wasm32 target dependencies ---
# `wasm32-unknown-unknown` cannot build `mio` (hence tokio's `net`), so tokio
# takes only the features it supports there (`io-util, rt, macros, sync, time`),
# exactly as `lodestone-net` does. This is the whole unlock: with it a browser
# can run `IntegratedServer::open_in_memory` singleplayer *in-process* over the
# same `DuplexStream` transport `ClientBuilder::connect_with` already accepts —
# no relay, no socket, no server at all (plan §8, §16). `wasm-bindgen-futures`
# backs the task spawner, because a browser has no blocking tokio runtime to
# `tokio::spawn` into.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "rt",
    "macros",
    "sync",
    "time",
] }
wasm-bindgen-futures = { workspace = true }
# `crate::chunk::yield_to_browser`'s `js_sys::Promise::new` +
# `window.setTimeout`: the real browser macrotask yield that lets column
# generation give the tab back to the event loop between columns instead of
# generating a whole join/streaming batch inline. Same versions
# `lodestone-shell`/`lodestone-net` already pin for wasm32 (`Window` is the
# only feature this crate's own use needs; no direct `wasm-bindgen` call, so
# unlike those two crates this one does not need that dependency itself).
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }

[dev-dependencies]
# `test-util` for `#[tokio::test(start_paused = true)]` + time-auto-advance,
# used by `tests/serve_play.rs` to observe the keep-alive timeout and the
# periodic time-of-day broadcast without a real 15-second wait — the same
# precedent `lodestone-net`'s own dev-dependency (`Cargo.toml`) already sets.
tokio = { workspace = true, features = ["test-util"] }
# `src/chat_session.rs`'s tests build a throwaway RSA key pair (the same
# fixed PKCS#8-DER test key `lodestone-auth`'s own `chat_session` tests and
# `lodestone-client`'s `driver.rs` tests already use) to sign a fixture
# message and independently re-verify it against `crate::chat_session::decide`.
# Dev-only and therefore never part of the `wasm32` production build this
# crate's own `Cargo.toml` otherwise guards closely: `cargo build` excludes
# `[dev-dependencies]`, only `cargo test` pulls them in, and this crate's own
# tests run natively (see `crate::chat_session`'s test module, gated
# `not(target_arch = "wasm32")` to match `lodestone-auth`'s own gate on the
# real dependency).
rsa = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
lodestone-client = { path = "../lodestone-client" }
lodestone-model = { path = "../lodestone-model" }
# Issue #273's online-mode test (`server::tests`, the `LoginStart` ->
# `EncryptionResponse` sequence): the only real `ServerProtocol` implementor
# with actual online-mode wire support, and its packet types, to drive a
# faithful handshake rather than a hand-rolled wire format that could drift
# from the real one. Dev-only: `lodestone-v26-2`'s own *normal* dependency on
# this crate (for the `ServerProtocol` trait it implements) is not a cycle
# here, since a dev-dependency is excluded from the normal build graph.
lodestone-v26-2 = { path = "../versions/26.2" }
# `tests/chunk_nbt_vanilla_oracle.rs` opens a real 26.2 `.mca` directly, rather
# than through this crate's own loader, so the oracle reads the file with
# something other than the code under test.
lodestone-anvil = { path = "../lodestone-anvil" }
# `tests/rcon.rs` (issue #331) points the same `RconClient`/`AsyncRconClient`
# the live oracle tests use against vanilla at our own listener — the
# verification the issue body calls for. `lodestone-testsupport` does not
# depend on `lodestone-server`, so this adds no cycle.
lodestone-testsupport = { workspace = true }
# `tests/worldgen_structure_corpus.rs` (issue #484) hashes the 1606 bundled
# structure-corpus assets against a jar-derived SHA-256 manifest. Dev-only: the
# manifest is a test anchor, nothing in `src/` hashes anything. Same
# `[workspace.dependencies]` entry the OAuth PKCE path already builds against,
# so no new version enters the graph.
sha2 = { workspace = true }

# criterion, `default-features = false` + only `cargo_bench_support`, matching
# every other bench site in this workspace: that combination excludes
# `plotters`, `rayon`, `itertools`, `regex` and `walkdir` entirely, so adding a
# bench pulls no new code into any non-bench build. Dev-only, so it never
# reaches this crate's wasm32 surface.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# What a server tick costs and how it scales with the population being ticked
# — the client-side benches measure everything but the simulation, and
# deciding whether ticking should be partitioned needs the tick's own number
# first. Drives a real `run_tick_loop` under a paused runtime clock, so the
# waiting is virtual and the work is real.
[[bench]]
name = "server_tick"
harness = false
