# Trunk dev-server config for the browser build of Lodestone (the real shell —
# see src/main.rs's own doc for why this is no longer "the wasm render spike").
#
# `just run-wasm` no longer uses `trunk serve` at all — see scripts/run-wasm.sh.
# It pairs `trunk watch` (rebuild `dist/` on change, no serving) with
# `lodestone-web-server` (web/server/src/main.rs), a small native binary that
# links `lodestone-relay` in as a library and serves both the built page AND
# `/relay` from one listener, one process. That binary is also what a real
# deployment runs — `trunk serve`'s own proxy could never be that, since it is
# a dev-server-only feature. This file's `[[proxies]]` entry, which used to
# forward `/relay` to a separately-run `lodestone-relay` process, is GONE for
# that reason: it would just be a second, redundant way to reach a relay that
# `run-wasm`'s new binary already serves on the one port trunk itself is not
# using any more.
#
# `[serve]`/COOP+COEP below still matter for the one thing they are still for:
# `cd web && trunk serve --release` as a standalone, page-only dev loop (fast
# visual iteration, no relay, no multiplayer ping — same restriction it always
# had before the relay existed). Use `just run-wasm` for anything that needs
# `/relay` to work; see web/README.md → "Run it".
#
# The COOP/COEP headers are set NOW even though the shell does not yet use
# `wasm-bindgen-rayon`/threads. They are required the moment it does, they are
# free today, and a missing cross-origin isolation header is a genuinely
# confusing thing to debug later. Setting them early means the browser is
# already cross-origin isolated when threading lands. `lodestone-web-server`
# sets the identical two headers on every response for the same reason.
[serve]
addresses = ["127.0.0.1"]
port = 8080
headers = { "Cross-Origin-Opener-Policy" = "same-origin", "Cross-Origin-Embedder-Policy" = "require-corp" }

# Stage the two large game-data blobs beside the page — IF the local cache has
# them. `index.html` carries the full reasoning; the short version is that these
# were `data-trunk rel="copy-file"` links, which made `trunk build` a hard
# dependency on 46 MB of gitignored files and so failed on every CI runner and on
# every contributor's first build. A `post_build` hook can be conditional; a
# `copy-file` link cannot. Normal local development keeps the direct jar. Set
# `LODESTONE_WEB_CLIENT_JAR_PARTS=1` for a static host with a per-file cap: the
# hook then emits relative, content-addressed 20 MiB `client.jar.part-*` files and
# their manifest instead, which `src/client_jar.rs` validates before reconstruction.
#
# Three things about the shape:
#   * `stage = "post_build"` runs after the wasm bundle is written and BEFORE the
#     staging dir becomes `dist/`, so `$TRUNK_STAGING_DIR` is the right target and
#     the copies survive trunk's swap. A `pre_build` hook would write into a dir
#     that is about to be replaced.
#   * the hook's cwd is this file's directory, so `../.cache/…` resolves exactly as
#     the old `href` did.
#   * absent files print a NAMED line and exit 0 — degradation, not a silent skip.
#     A `cp` that fails for any OTHER reason (present but unreadable) still fails
#     the hook and the build, which is correct: that is a real error.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = [
  "-c",
  "if [ -f ../.cache/mc/26.2/client.jar ]; then if [ \"${LODESTONE_WEB_CLIENT_JAR_PARTS:-0}\" = 1 ]; then python3 scripts/stage_client_jar_parts.py --jar ../.cache/mc/26.2/client.jar --out \"$TRUNK_STAGING_DIR\"; else cp ../.cache/mc/26.2/client.jar \"$TRUNK_STAGING_DIR/\"; fi; else echo \"trunk hook: ../.cache/mc/26.2/client.jar is absent, not staged — the page will report ASSET LOAD FAILED and draw nothing (see web/README.md)\"; fi; if [ -f ../.cache/mc/26.2/generated/reports/blocks.json ]; then cp ../.cache/mc/26.2/generated/reports/blocks.json \"$TRUNK_STAGING_DIR/\"; else echo \"trunk hook: ../.cache/mc/26.2/generated/reports/blocks.json is absent, not staged — the page will report ASSET LOAD FAILED and draw nothing (see web/README.md)\"; fi",
]

# The server bundle is a second wasm module because it must execute in a
# dedicated Worker, not beside winit on the page. It is built and staged after
# the page bundle so the bootstrap and its wasm sibling share one deployment.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "scripts/stage_worker.sh \"$TRUNK_STAGING_DIR\""]

# Stage the real (non-stub) title-screen panorama faces, IF the local
# asset-object store has them — same conditional-staging shape as the hook
# above, and the same reason: these come from ~2.6 MB of gitignored files
# (`cargo run -p xtask -- fetch-assets --version 26.2`) that must not be a hard
# build dependency. Unlike the hook above, absence here is NOT degraded to
# "the page draws nothing" — `client.jar` ships a working (if flat, 1x1 grey)
# stub for each face, so `fetch_panorama_faces` in `src/main.rs` just falls
# back to it per missing face. See `scripts/stage_panorama.py`'s module doc
# for the full chain, and `crates/lodestone-shell/src/asset_objects.rs` for
# why the panorama specifically needs this second source at all.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = [
  "-c",
  "python3 scripts/stage_panorama.py --cache-dir ../.cache/mc/26.2 --out \"$TRUNK_STAGING_DIR\"",
]

# Stage a curated `.ogg` sound subset (plus the full `sounds.json` registry),
# IF the local asset-object store has them — same conditional-staging shape
# and the same reason as the two hooks above: `scripts/stage_sounds.py`'s
# module doc has the full curation rationale and the measured byte counts
# (46 objects / ~1.0 MB raw, ~410 KB gzip). Unlike the panorama hook, this one
# feeds a genuinely new capability rather than falling back to an existing
# stub: with nothing staged, `ShellAudio::from_env` degrades to "audio
# disabled" exactly as it already does with an empty `Bundle`, so a checkout
# with no populated `.cache/mc` still boots — just silently, as it always did
# before this hook existed.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = [
  "-c",
  "python3 scripts/stage_sounds.py --cache-dir ../.cache/mc/26.2 --out \"$TRUNK_STAGING_DIR\"",
]
