# Trunk configuration for the browser build. Standalone `trunk serve` serves the
# page only; `just run-wasm` uses the native web server for `/relay`.
# COOP/COEP keep the page cross-origin isolated for shared-memory workers.
[serve]
addresses = ["127.0.0.1"]
port = 8080
headers = { "Cross-Origin-Opener-Policy" = "same-origin", "Cross-Origin-Embedder-Policy" = "require-corp" }

# Stage the filtered client resource pack after the wasm bundle is built. Missing
# cache inputs are reported and tolerated; malformed present archives fail.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = [
  "-c",
  "if [ -f ../.cache/mc/26.2/client.jar ]; then if [ \"${LODESTONE_WEB_CLIENT_JAR_PARTS:-0}\" = 1 ]; then tmp=\"$(mktemp -d)\"; trap 'rm -rf \"$tmp\"' EXIT; python3 scripts/stage_resource_pack.py --jar ../.cache/mc/26.2/client.jar --out \"$tmp\"; python3 scripts/stage_client_jar_parts.py --jar \"$tmp/client.jar\" --out \"$TRUNK_STAGING_DIR\"; else python3 scripts/stage_resource_pack.py --jar ../.cache/mc/26.2/client.jar --out \"$TRUNK_STAGING_DIR\"; fi; else echo \"trunk hook: ../.cache/mc/26.2/client.jar is absent, not staged — the page will report ASSET LOAD FAILED and draw nothing (see web/README.md)\"; fi; if [ -f ../.cache/mc/26.2/generated/reports/blocks.json ]; then cp ../.cache/mc/26.2/generated/reports/blocks.json \"$TRUNK_STAGING_DIR/\"; else echo \"trunk hook: ../.cache/mc/26.2/generated/reports/blocks.json is absent, not staged — the page will report ASSET LOAD FAILED and draw nothing (see web/README.md)\"; fi",
]

# Build and stage the server wasm module for its dedicated Worker.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "scripts/stage_worker.sh \"$TRUNK_STAGING_DIR\""]

# Stage optional title-screen panorama assets from the local asset cache. Missing
# faces use the fallback contained in the resource pack.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = [
  "-c",
  "python3 scripts/stage_panorama.py --cache-dir ../.cache/mc/26.2 --out \"$TRUNK_STAGING_DIR\"",
]

# Stage the curated sound subset and sound registry when available. An empty
# cache leaves audio disabled without preventing the browser from booting.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = [
  "-c",
  "python3 scripts/stage_sounds.py --cache-dir ../.cache/mc/26.2 --out \"$TRUNK_STAGING_DIR\"",
]
