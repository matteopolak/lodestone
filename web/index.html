<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lodestone</title>
    <!-- Inline data-URI favicon: the browser never issues a /favicon.ico request,
         so there is no 404 under a plain static server (trunk's dev server hides
         it behind an SPA fallback, but `dist/` served by anything else would 404). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0a12'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%232ea22e'/%3E%3C/svg%3E"
    />
    <link data-trunk rel="rust" data-wasm-opt="0" />

    <!-- The renderable corpus (`client.jar`) and the block-state id table
         (`blocks.json`) are NOT referenced here, on purpose. They are copied out of
         the local `.cache/mc/26.2` by the `post_build` hook in `Trunk.toml`, which
         stages them only IF THEY EXIST; `src/main.rs` then `fetch`es them by
         basename beside the page and hands the bytes to
         `lodestone::platform::assets::install`.

         They used to be two `data-trunk rel="copy-file"` links right here, and that
         is a build-time HARD dependency on 46 MB of gitignored, uncommitted files:
         `trunk build` failed outright wherever `.cache/` was absent — every CI
         runner, and every contributor's first build. Moving them to an optional
         staging step is the fix, and it costs nothing at runtime, because a missing
         asset was ALREADY handled: the page reports "ASSET LOAD FAILED", naming the
         fetch, and draws nothing. That is deliberate — a synthetic stand-in on
         screen is indistinguishable from a working session — and it is a better
         place for the failure than the build, which cannot tell "the developer has
         not populated .cache yet" from "the browser build is broken".

         Populate the cache the same way a native run does — see web/README.md. -->

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0a12;
        overflow: hidden;
      }
      /* The canvas winit binds to. `resumed` looks this element up by id and passes
         it to `WindowAttributesExtWebSys::with_canvas`; without it winit creates its
         own canvas and does NOT insert it into the DOM, so the game would run and
         render and be invisible. Keep the id in sync with `CANVAS_ID` in
         `crates/lodestone-shell/src/app/lifecycle.rs`. */
      #lodestone {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
      }
      /* Boot status, removed by the shell's first frame covering it. Plain text
         rather than a spinner: the two fetches are tens of megabytes on a cold
         cache, and a number is more use than an animation. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #cfe;
        font: 14px/1.5 ui-monospace, monospace;
        text-align: center;
        pointer-events: none;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="lodestone" tabindex="0"></canvas>
    <div id="boot">starting…</div>
  </body>
</html>
