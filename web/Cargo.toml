# The browser build of Lodestone.
#
# This is its OWN workspace (note the empty `[workspace]` table below) and lives
# *outside* the parent `crates/lodestone-*` glob, so it never affects any other
# agent's `cargo build --workspace`. **Keep it that way** — that isolation is
# deliberate, and `just wasm-check` is what covers this crate instead.
#
# It used to be a feasibility spike with its own application: its own `main`, its
# own camera and HUD, a committed chunk fixture, and no `lodestone-shell`
# dependency at all. It is now a thin launcher for the real shell — see
# `src/main.rs` and `docs/browser-shell-port.md`.
[package]
name = "lodestone-web"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# This crate is its own workspace root, NOT attached to the parent Lodestone
# workspace — `server` (a plain native binary, see web/server/src/main.rs) is
# the only other member, added so it shares this workspace's own
# web/Cargo.lock rather than the root one. Neither member is swept into the
# parent's `cargo build --workspace`: `cargo` run from a directory whose
# manifest has BOTH `[package]` and `[workspace]` builds only that package by
# default (no --workspace), which is also why `trunk build`/`trunk watch`,
# invoked from this directory, never touches `server` even though it is now a
# workspace member.
[workspace]
members = ["server"]

[features]
# Keep the deployed browser's current behavior. A security-conscious deployment
# can use `--no-default-features` on both this package and `web/server` to make
# a singleplayer-only page and a static-only server.
default = ["multiplayer"]
multiplayer = ["lodestone-shell/multiplayer"]

[dependencies]
# **The whole game.** The same crate the native `lodestone` binary is built from:
# the menu, `Sim`, the renderer, physics, the integrated server. Everything on
# screen comes from here, and this crate adds no gameplay, no rendering and no
# protocol of its own.
#
# Its default `live` feature compiles the vanilla-26.2 (protocol 776) family into
# the registry, exactly as a native build gets it, so the browser can join and host
# the same version. Every other Lodestone crate arrives transitively — listing them
# here as well would let this manifest drift from the shell's own graph, which is
# the thing that made `web/` a separate application in the first place.
lodestone-shell = { path = "../crates/lodestone-shell", default-features = false, features = ["live", "runtime-presentation", "window"] }

# --- The three things a browser needs that a native `main` does not ---
# `spawn_local` for the boot task (fetch the assets, then start the shell), and the
# `fetch`/`Response`/`Uint8Array` trio behind it. This is the only asynchronous step
# in the asset path; everything downstream is the shell's existing synchronous
# parsers. See `src/main.rs`.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Request",
  "RequestCache",
  "RequestInit",
  "Response",
] }
# `console_log` replaces the native `tracing-subscriber` (there is no stderr), and
# the panic hook makes a Rust panic name its own location instead of surfacing as a
# bare wasm `unreachable`. With `panic = "abort"` below, that hook is the difference
# between a diagnosable failure and a dead tab.
console_error_panic_hook = "0.1"
log = "0.4"
console_log = "1"
# **`tracing` with its `log` feature, and this edge is load-bearing for diagnosis.**
# The shell logs through `tracing`, but `console_log` only bridges the `log` crate — so
# without this, every `tracing::info!`/`warn!`/`error!` in the entire game goes nowhere
# in a browser. Measured: the first successful title screen produced a console with four
# `[boot]` lines and *nothing else*, while the shell was internally reporting audio
# disabled, the mesher's budget and any asset that failed to resolve. Enabling `log`
# makes `tracing` emit a `log` record for every event, which `console_log` prints.
#
# Only affects the browser build: `web/` is its own workspace, so this feature does not
# unify into the native graph.
tracing = { version = "0.1", features = ["log"] }

# **Not used by any code here — this edge exists only to turn a feature on.**
# `getrandom` 0.2 has a hard `compile_error!` on `wasm*-unknown-unknown` unless
# its `js` feature is enabled, and it reaches this graph several levels down
# (`lodestone-v26-2` -> `rand` 0.8 -> `rand_core` 0.6 -> `getrandom` 0.2). None of
# those can enable it (the parent workspace builds natively, where `js` would be
# wrong), so under Cargo's feature unification the only crate that can is this
# one. Symptom without it: `cargo build --target wasm32-unknown-unknown` fails in
# `getrandom`'s own `lib.rs` with no mention of Lodestone at all, which is why
# `just wasm-size` was unrunnable and the 1.6 MB gzip ceiling therefore
# **unenforced** for as long as it stood broken.
#
# Scoped to wasm32 rather than declared unconditionally so a native build of this
# crate — which nothing does today, but which is one `cargo build` away — does not
# silently get the browser RNG backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# Release profile tuned for a browser bundle: small code + stripped symbols. LTO
# and a single codegen unit let the linker drop cross-crate dead code (most of
# wgpu's native backends), `panic = "abort"` removes unwinding tables, and
# `strip` drops debuginfo/symbol names. `opt-level = "z"` measured smallest
# over-the-wire in the W4 report (vs "s" and 3).
#
# **`panic = "abort"` is why a trapping call is fatal rather than recoverable**, and
# therefore why `crate::platform`'s clock seam and the mesher's thread-free arm
# exist at all. Do not turn it off to make a trap survivable — fix the trap.
#
# `opt-level = "z"` is worth re-measuring now that the whole shell is linked in:
# the frame budget mattered nothing at the spike's ~250 quads and matters a great
# deal for real terrain. Measure before changing it, and report the gzip number —
# `just wasm-size` enforces a 1,600,000 B ceiling.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
