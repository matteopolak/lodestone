# Browser launcher workspace for Lodestone. It remains separate from the parent
# workspace so browser-only dependencies and checks do not affect native builds.
[package]
name = "lodestone-web"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# This manifest is the workspace root. The server and worker members share its
# lockfile while remaining outside the parent workspace.
[workspace]
members = ["server", "worker"]

[features]
# Multiplayer is enabled by default; disable it for a singleplayer-only page.
default = ["multiplayer"]
multiplayer = ["lodestone-shell/multiplayer"]

[dependencies]
# The browser uses the same shell, gameplay, renderer, and protocol registry as
# the native client.
lodestone-shell = { path = "../crates/lodestone-shell", default-features = false, features = ["live", "runtime-presentation", "window"] }

# Browser bindings used by the launcher to fetch assets and start the shell.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "OffscreenCanvas",
  "Worker",
  "MessageEvent",
  "Node",
  "Request",
  "RequestCache",
  "RequestInit",
  "Response",
] }
# Browser logging and panic diagnostics (the browser has no native stderr).
console_error_panic_hook = "0.1"
log = "0.4"
console_log = "1"
# Bridge shell `tracing` events to the browser console through `log`.
tracing = { version = "0.1", features = ["log"] }

# Enable the JavaScript backend required by the transitive wasm RNG dependency.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# Release profile tuned for a compact browser bundle.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
