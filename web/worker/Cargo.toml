[package]
name = "lodestone-server-worker"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
wasm-threads = [
    "dep:rayon",
    "dep:wasm-bindgen-rayon",
    "lodestone-shell/wasm-threads",
    "lodestone-server/wasm-threads",
]

[dependencies]
lodestone-shell = { path = "../../crates/lodestone-shell", default-features = false, features = ["live"] }
lodestone-server = { path = "../../crates/lodestone-server", default-features = false, features = ["bundled-worldgen-v26_2"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["MessagePort"] }
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rayon = { version = "1.12", optional = true, features = ["web_spin_lock"] }
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }
