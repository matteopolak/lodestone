[package]
name = "lodestone-server-worker"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
lodestone-shell = { path = "../../crates/lodestone-shell", default-features = false, features = ["live"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["MessagePort"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
