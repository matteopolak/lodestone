[toolchain]
# Nightly, deliberately: worldgen's rewrite uses `std::simd`, which is gated behind
# `#![feature(portable_simd)]` and is nightly-only. The alternative was a
# `#[cfg]`-selected scalar fallback, and that was rejected on parity grounds --
# SIMD changes float accumulation order, so two arms can each be individually
# "correct" and generate two different worlds from one seed, with nothing in a
# single-arm test run able to see it. One implementation, gated once against the
# JVM oracle, is the cheaper correctness story.
#
# The cost, stated rather than discovered later: `portable_simd` is an unstable
# API that can change under us, and an unpinned `nightly` means any `rustup
# update` can break the build. If that churn becomes expensive, pin a dated
# nightly (`channel = "nightly-YYYY-MM-DD"`) rather than returning to stable.
# **Pinned, and to this date specifically.** Two nightlies days apart differ on a
# codegen ICE: rustc `7608eb7b0` panics compiling tokio 1.53.1 at `opt-level=3`
# when dev-deps enable `rt-multi-thread`, which breaks `cargo test --release` and
# `cargo bench` workspace-wide. `84b36a78a` does not. Since the worldgen rewrite's
# whole premise is release-profile measurement (`docs/plans/worldgen-rewrite.md`),
# an unpinned channel means a `rustup update` can silently remove the ability to
# benchmark, and a moving compiler makes a performance baseline unreproducible.
#
# **The date is the *publish* date, not the commit date, and they do not match.**
# `nightly-2026-08-07` is rustc `84b36a78a (2026-08-06)` — the validated one.
# `nightly-2026-08-06` is rustc `7608eb7b0 (2026-08-05)` — the one that ICEs.
# Reading the rustc date and pinning the same-numbered channel gets you the wrong
# compiler; verify with `rustup run <channel> rustc --version` before changing this.
#
# Validated at this pin: `cargo build --release --workspace --all-targets` (292
# crates, 0 errors, 0 ICEs) and `cargo bench -p lodestone-worldgen --no-run`.
channel = "nightly-2026-08-07"
# `rustc-codegen-cranelift-preview` is load-bearing, not optional: .cargo/config.toml
# sets `profile.dev.codegen-backend = "cranelift"`, so without this component every
# debug build fails outright rather than falling back to LLVM. Declared here for the
# same reason `targets` is below — a pin installed with `--profile minimal` carries
# only what it names, and the previously-floating `nightly` happened to already have
# things this one does not.
components = ["rustfmt", "clippy", "rustc-codegen-cranelift-preview"]
# `targets` is load-bearing, not decoration. Pinning the channel above was done with
# `rustup toolchain install --profile minimal`, which installs the host target only —
# and the previously-floating `nightly` happened to already carry
# `wasm32-unknown-unknown`. The result was 19 `lodestone-wasm-host` tests failing to
# build their guest, on a pin that had otherwise been verified green: an environmental
# break that looks exactly like a code regression. Declaring the target here makes the
# pin self-sufficient, so a fresh checkout or a new machine cannot reproduce it.
targets = ["wasm32-unknown-unknown"]
