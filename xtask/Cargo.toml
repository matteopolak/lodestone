[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
sha1 = { version = "0.11", default-features = false }
zip.workspace = true
# `islands` (the syn-based dead-code/unwired-feature scanner) needs the
# `visit` feature on top of what the workspace default already turns on for
# `lodestone-macros`'s proc-macro use (`full`, `extra-traits`); this crate
# is the only one that walks an AST with `syn::visit::Visit` rather than
# just deriving from one, so the extra feature is requested here rather
# than widened workspace-wide.
syn = { workspace = true, features = ["visit"] }
# `span-locations` is what makes a parsed `Span`'s `start()` return a real
# line number rather than the fallback (0, 0) — needed by `ptr_const`'s
# guard to name a file:line for a planted violation, the same way
# `scan_confinement_dir` already does for its grep-based rules.
proc-macro2 = { workspace = true, features = ["span-locations"] }
# `protocol-dup`'s struct/function/dispatch-arm normalisation tokenizes a
# cloned (attribute-stripped) `syn` item via `ToTokens::to_token_stream`
# rather than hand-stripping comments from source text -- proc-macro2's own
# lexer already discards comments correctly during parsing, which a
# text-based strip cannot promise (see this crate's own note on
# `&'static str` opening what looks like an unterminated char literal).
quote = { workspace = true }
# `world-coverage` enumerates its three populations from the real 26.2
# registries rather than from a transcription of them, and resolves the entity
# rig corpus by asking the corpus. Both crates are leaf-ish and version-free
# (`lodestone-data` depends only on `lodestone-model`), so this pulls no
# protocol family and no wgpu into the task runner -- the alternative,
# re-parsing the generated tables here, would be a second implementation of
# the registry that could drift from the one production reads.
lodestone-data.workspace = true
lodestone-assets.workspace = true

[dev-dependencies]
tempfile.workspace = true
