# Explicit exceptions for `cargo xtask check-comment-voice`.
#
# Each entry needs a `file` (relative to the workspace root), an `owner` and a
# `reason` so an exception is a recorded decision, not a silent miss. `line`
# is optional -- omit it to allow every hit in that file, or set it to allow
# only that one line. Delete entries as their file/line is swept clean; a
# stale entry (matching zero hits) is reported, not silently ignored.
