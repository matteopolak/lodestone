name: Branch checks

on:
  push:
    branches:
      - "codex/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  native:
    name: Native check and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install system audio dev headers
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: branch-check-native
          cache-targets: "false"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - run: just check
      - name: Run worldgen library tests with LLVM
        run: CARGO_PROFILE_DEV_CODEGEN_BACKEND=llvm cargo test -p lodestone-worldgen --lib --no-fail-fast
      - name: Run server library tests with LLVM
        if: always()
        run: CARGO_PROFILE_DEV_CODEGEN_BACKEND=llvm cargo test -p lodestone-server --lib --no-fail-fast

  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: branch-check-wasm
          cache-targets: "false"
          workspaces: |
            .
            web
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - name: Install trunk
        run: |
          set -eu
          curl -sSfL \
            https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$HOME/.cargo/bin" trunk
          trunk --version
      - name: Install wasm-bindgen CLI
        run: |
          set -eu
          curl -sSfL \
            https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.126/wasm-bindgen-0.2.126-x86_64-unknown-linux-musl.tar.gz \
            | tar xz --strip-components=1 -C "$HOME/.cargo/bin"
          wasm-bindgen --version
      - run: just wasm-check
