# CI for lodestone. See docs/ci.md for the full rationale, what is
# intentionally NOT run here (the `#[ignore]`d live/GPU/jar-dependent tests —
# that doc carries the count and a warning that it is stale), and how to
# reproduce any of these jobs locally.
#
# Eight jobs, ten legs: `check-default` is a 3-OS matrix (Linux / macOS /
# Windows) and every other job is Linux-only on purpose — see that job's comment
# for which axis each one varies and why re-running it per OS would measure the
# same thing three times. GitHub bills macOS runner minutes at 10x and Windows at
# 2x the Linux rate, so "which platform catches what" is a real design question
# here and not a formality; docs/ci.md carries the arithmetic.
#
# Four of the six jobs below call the `just` recipes that are four of
# CLAUDE.md's five "Build and test" health checks, one per job so a failure
# names itself instead of hiding behind three green jobs and one red one:
#
#   just check       # cargo check --workspace --all-targets
#   just check-all    # cargo check --workspace --all-features --all-targets --exclude lodestone-allocbench
#   just check-seam   # cargo check -p lodestone-shell --no-default-features
#   just test         # cargo test --workspace --no-fail-fast
#
# The fifth health check, `just check-comment-voice` (cargo xtask
# check-comment-voice), runs as a step inside `xtask-structural-checks`
# instead — it is a cheap text scan with no OS/feature axis worth a job of
# its own, unlike the four above.
#
# plus two that are not "Build and test" health checks but are the only
# automatic runners of their respective tripwires — see each job's own comment
# for why it is here and not in `just health`:
#
#   just wasm-check   # cargo xtask wasm-check
#   just fuzz-smoke   # ./fuzz/smoke.sh 30
#
# and one that answers "what runs the benchmarks":
#
#   just bench-record && just bench-gate
#
# The benchmark suite was a set of 29 criterion files that NOTHING invoked
# automatically, with every recorded number living in a gitignored local log
# no other machine could read. `bench-gate` runs the subset whose metrics are
# deterministic COUNTS -- per-frame API calls, drawn sections, quads, atlas
# pixels, structural heap bytes -- and compares them to the committed
# bench-baselines/. Deliberately no wall-clock number is gated: a duration
# baseline is a wall-clock ceiling, which is the shape that failed this repo
# once already on perfectly healthy code under load. See
# docs/benchmark-regression-gate.md.
#
# `just` is the canonical *command* layer (docs/task-runner.md) — calling the
# recipe instead of retyping the raw invocation makes command drift between
# this file and CLAUDE.md impossible by construction rather than merely
# checked. Each job installs a pinned `just` (extractions/setup-just, commit
# SHA below) before its first recipe invocation. CI sets neither
# `LODESTONE_TARGET_DIR` nor `LODESTONE_JOBS`, so every recipe here expands to
# the identical bare command it always ran — no shared target dir, no
# hardcoded `-j`.
#
# The sixth (xtask-structural-checks) runs cargo xtask's own dependency-graph
# checks (check-isolation, check-deletable) plus the fifth health check,
# check-comment-voice — all cheap, CLAUDE.md-adjacent, and none needing the
# platform/feature variance that justifies check/check-all/check-seam having
# their own jobs. It is left calling `cargo run -p xtask` directly: the
# Justfile's `xtask *args` passthrough always adds `-q`, which is not
# byte-identical to this job's existing invocation, so converting it would
# change what the job actually runs rather than just naming it.
#
# Do not "simplify" the --exclude on the all-features job away: lodestone-allocbench
# has a deliberate compile_error!() when more than one allocator feature is on
# (each installs its own #[global_allocator]), so plain --all-features
# structurally cannot pass for that one crate. Excluding it is not a workaround.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No incremental cache to preserve — every job is a from-cache-or-fresh CI
  # build, and incremental compilation only adds bookkeeping overhead here.
  CARGO_INCREMENTAL: 0
  # Debug info is dead weight in CI: nothing here symbolizes a crash dump, and
  # the workspace's own measurement (docs/ci.md) is a lodestone-shell debug
  # test binary reaching 3.7 GB RSS. Turning off DWARF emission for dev/test
  # profiles shrinks both link time and binary size without touching
  # optimization level or debug_assertions (semantics are unchanged).
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # The dev machine's `.cargo/config.toml` is gaining a repo-wide, unconditional
  # `build.rustc-wrapper = "…/sccache"` line, so every job here MUST make a real
  # `sccache` binary available before its first `cargo` invocation (mozilla-actions
  # /sccache-action below) — a config-level wrapper pointing at a missing binary is
  # a hard error, not a slow fallback. Setting RUSTC_WRAPPER here is also what makes
  # this repeatable regardless of what path `.cargo/config.toml` hardcodes: cargo's
  # config precedence has an environment variable win over a config-file value, so
  # this always resolves through PATH to whatever the action just installed. See
  # docs/ci.md's "sccache in CI, and what it is actually worth" for the escape
  # hatch (RUSTC_WRAPPER: "") if a future job or runner genuinely can't run the action.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

# A new PR push supersedes the old one — no point finishing a check run
# against a diff nobody will look at. But NOT for push-to-main: main here is
# a shared trunk with many agents pushing every few minutes (empirically,
# every few minutes — measured directly: the first-ever run of this workflow
# had its ~35-minute `test` job cancelled by the *next* push before it could
# finish a single time), and every commit on main is real, permanent history
# that deserves its own result, not a perpetually-superseded one. Restricting
# cancel-in-progress to pull_request keeps the fast-iteration benefit for PRs
# without starving `test` on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one job that runs on all three desktop platforms. `just check` is the
  # per-platform check because what actually differs between macOS, Linux and
  # Windows is `#[cfg]`-selected code, path handling and platform crates — not
  # business logic, which the Linux-only jobs below already cover once.
  #
  # Everything else here is deliberately Linux-only, and each for a reason rather
  # than to save money: `check-all` varies *features*, `check-seam` varies the
  # *version seam*, `xtask-structural-checks` reads the *dependency graph*, and
  # `wasm` targets wasm32 from any host. None of those axes is the OS, so running
  # them three times measures the same thing three times. See docs/ci.md for the
  # runner-cost multipliers that make that distinction worth drawing.
  #
  # KNOWN GAP, stated rather than discovered later: `cargo check` NEVER LINKS, so
  # this job cannot see an unresolved symbol. That is not hypothetical — the
  # Darwin-only `proc_pid_rusage` FFI in five test/bench targets passed every
  # `check` job on Linux for this workflow's whole life and failed the `test` job
  # at `rust-lld: error: undefined symbol: proc_pid_rusage`. On Linux the `test`
  # job links and so closes that gap; on macOS and Windows nothing here links.
  # docs/ci.md's "What the matrix does not cover" says what would close it and
  # what it would cost.
  check-default:
    name: "check: just check (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      # Load-bearing. With the default `fail-fast: true`, the first leg to go red
      # CANCELS the other two, so a Windows-only break would hide whether macOS
      # was fine and you would learn one thing per run instead of three. A
      # cancelled leg also reports as neither pass nor fail, which is the
      # "green job that ran nothing" shape this file tries to avoid.
      fail-fast: false
      matrix:
        # Spelled out with `include` rather than as a bare `os:` list because the
        # Windows leg needs `rustc_wrapper` empty, and the tempting one-liner
        # `${{ matrix.os == 'windows-latest' && '' || 'sccache' }}` is a TRAP: an
        # empty string is falsy in a GitHub expression, so the `&&` yields it, the
        # `||` then fires anyway and every leg gets `sccache`. A matrix value
        # cannot be misread that way.
        include:
          - os: ubuntu-latest
            rustc_wrapper: sccache
          - os: macos-latest
            rustc_wrapper: sccache
          # sccache is DISABLED on Windows, and this is a measured limitation
          # rather than a preference. `sccache` re-spawns `rustc` itself, and the
          # `lodestone-shell` invocation carries several hundred
          # `-L dependency=D:\a\lodestone\lodestone\target\debug\build\…` flags —
          # past Windows' 32,767-character command-line limit. The leg failed with
          # `sccache: error: failed to spawn Command {…}` / `os error 206`
          # (ERROR_FILENAME_EXCED_RANGE, "The filename or extension is too long")
          # while every other leg passed. Cargo can spawn that command; sccache
          # in front of it cannot. `RUSTC_WRAPPER: ""` is the escape hatch
          # docs/ci.md already documents for exactly this case, and an env var
          # beats the committed `.cargo/config.toml` `build.rustc-wrapper` line in
          # cargo's config precedence — which matters here, because that line
          # hardcodes a Homebrew path that does not exist on any runner.
          - os: windows-latest
            rustc_wrapper: ""
    env:
      RUSTC_WRAPPER: ${{ matrix.rustc_wrapper }}
    steps:
      - uses: actions/checkout@v4
      # Linux only. macOS reaches CoreAudio and Windows reaches WASAPI through
      # frameworks that ship with the SDK, so `cpal`/`alsa-sys` needs no dev
      # package there; `alsa-sys` is Linux-gated in cpal's own manifest and is
      # not in the dependency graph on the other two legs at all.
      - name: Install system audio dev headers (alsa-sys build dependency)
        if: runner.os == 'Linux'
        # Bounded because this step, not the suite, is what produced this
        # workflow's six-hour runs: two stalled about 359 minutes inside
        # apt-get update at the identical mirror line, before compiling
        # anything. It is the job's first step, so unbounded a hung mirror
        # burns the whole job budget and reports as a timeout of the build.
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          # Per-OS key: the three legs build materially different `target/`s and
          # would otherwise thrash one cache entry between them.
          shared-key: check-default-${{ matrix.os }}
      # Skipped on the Windows leg, where the wrapper is disabled above — there is
      # no point installing a binary and a cache server nothing will invoke.
      - uses: mozilla-actions/sccache-action@v0.0.11
        if: matrix.rustc_wrapper != ''
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      # Print the compiler that will actually be used, and fail if there is none.
      # This is not decoration: the `toolchain:` input above is INERT — cargo
      # resolves `rust-toolchain.toml` (a pinned nightly) over any rustup default,
      # and rustup says so itself in the log ("the toolchain
      # 'nightly-2026-08-07-…' is currently in use (overridden by
      # …/rust-toolchain.toml)"). A job that names one compiler and silently runs
      # another should at least print which one won. See docs/ci.md.
      #
      # INERT IS NOT THE SAME AS REMOVABLE, and the obvious cleanup breaks every
      # job here. Do not delete the `toolchain:` input from this job or any other:
      # dtolnay/rust-toolchain@master declares it `required: true` and, because
      # GitHub does not enforce `required` inputs itself, its action.yml opens with
      # `if [[ -z $toolchain ]]; then echo "'toolchain' is a required input"; exit 1`.
      # Removing the line therefore fails at the install step rather than tidying
      # anything. docs/ci.md lists the three real options; "leave it" is one.
      - name: Report the toolchain actually in use
        shell: bash
        run: |
          set -eu
          rustc --version
          cargo --version
          # Empty on the Windows leg by design — see the matrix comment.
          echo "RUSTC_WRAPPER=${RUSTC_WRAPPER:-<unset>}"
      # `shell: bash` on all three legs so the command is literally identical
      # everywhere. Only Windows is affected (bash is already the default on the
      # other two), where the default would be pwsh; `just` itself shells out to
      # `sh`, which Git for Windows provides on the runner's PATH.
      - name: just check
        shell: bash
        run: just check

  check-all-features:
    name: "check: just check-all (allocbench excluded)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system audio dev headers (alsa-sys build dependency)
        # Bounded because this step, not the suite, is what produced this
        # workflow's six-hour runs: two stalled about 359 minutes inside
        # apt-get update at the identical mirror line, before compiling
        # anything. It is the job's first step, so unbounded a hung mirror
        # burns the whole job budget and reports as a timeout of the build.
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-all-features
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - run: just check-all

  check-shell-no-default:
    name: "check: just check-seam (version seam)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system audio dev headers (alsa-sys build dependency)
        # Bounded because this step, not the suite, is what produced this
        # workflow's six-hour runs: two stalled about 359 minutes inside
        # apt-get update at the identical mirror line, before compiling
        # anything. It is the job's first step, so unbounded a hung mirror
        # burns the whole job budget and reports as a timeout of the build.
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-shell-no-default
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - run: just check-seam

  xtask-structural-checks:
    name: "xtask: check-isolation / check-deletable / check-comment-voice"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No apt step here: xtask's own dependency graph (anyhow, serde_json,
      # sha1, zip, tempfile) never touches lodestone-sound/alsa-sys.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask-structural
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo run -p xtask -- check-isolation
      - name: check-deletable (every version family)
        run: |
          set -eu
          for family in v1-8 v1-9 v1-14 v26-2; do
            echo "::group::check-deletable $family"
            cargo run -p xtask -- check-deletable "$family"
            echo "::endgroup::"
          done
      # Fails on a comment/doc-comment written in the voice of the change
      # that introduced it, or a bare issue reference standing in for the
      # substance it pointed at -- see xtask/src/comment_voice.rs's module
      # doc. Exceptions live in xtask/check-comment-voice.toml, each with an
      # owner and a reason, never silently skipped.
      - run: cargo run -p xtask -- check-comment-voice

  # The wasm32 tripwire. This job is the whole point of `cargo xtask wasm-check`
  # existing: it was written to be a tripwire and NOTHING RAN IT — not `just
  # health`, not CI — so the first person to try `just run-wasm` found three
  # E0433s waiting in lodestone-server, each a `cfg(not(target_arch =
  # "wasm32"))` module named from ungated code. A tripwire nothing runs
  # automatically is not a tripwire.
  #
  # Deliberately NOT folded into `just health` instead, and this is the trade-off
  # rather than an omission. `health` is already four full workspace builds and is
  # the command every agent runs many times a session on one shared machine;
  # `scripts/wasm-check.sh`'s own header and `just wasm-size`'s comment both argue
  # against putting slow work in the command everyone runs, and adding a
  # ~15-crate wasm build plus a trunk build to it would tax every health run to
  # catch a regression that only lands on the browser surface. More decisively:
  # `just health` is a command someone *chooses* to run, so it cannot answer
  # "nothing runs this automatically". CI can, and does, on every push and PR.
  #
  # `web/` is its own Cargo workspace with its own Cargo.lock, deliberately
  # outside the root `members` glob, so `just check`/`check-all` have never
  # covered it and never will. That is the other half of why this rotted, and it
  # is why the trunk build inside wasm-check is load-bearing here rather than
  # redundant with the per-crate rows.
  #
  # Both prerequisites are installed explicitly below, and their absence is a
  # hard failure rather than a skip: `ensure_wasm_prereqs` bails with the install
  # command. That matters more here than anywhere else in this file — "wasm32
  # target not installed => skip" is the precondition species of vacuous test
  # (CLAUDE.md), a green that measures nothing, and it is exactly the shape a
  # wasm job in CI invites.
  wasm:
    name: "wasm: just wasm-check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No apt step: the wasm crate subset excludes lodestone-shell, and
      # lodestone-audio's cpal dependency is target-gated away for wasm32 (the
      # `cpal::` confinement guard in wasm-check is what keeps it that way).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          # The prerequisite wasm-check verifies. Installed here rather than left
          # to a `rustup target add` step so a toolchain bump cannot silently
          # drop it.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-check
          # web/ is a separate workspace with its own lockfile; without this the
          # cache key ignores it and a dependency bump there is invisible to the
          # cache.
          workspaces: |
            .
            web
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      # Pinned to the version CLAUDE.md and web/README.md both name (0.21.x), and
      # taken as a prebuilt tarball rather than `cargo install trunk`, which is a
      # multi-minute from-source build of a tool this job only shells out to.
      # trunk fetches its own wasm-bindgen-cli into its cache, so nothing else is
      # needed for the `(cd web && trunk build)` step inside wasm-check.
      - name: Install trunk
        run: |
          set -eu
          curl -sSfL \
            https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$HOME/.cargo/bin" trunk
          trunk --version
      - run: just wasm-check

  # The cargo-fuzz tripwire, and it exists for the same reason the wasm job
  # above does: `fuzz/` was a real, working, eleven-target libFuzzer workspace
  # that NOTHING RAN AUTOMATICALLY. A fuzz target nobody executes is an island
  # with a corpus — it keeps compiling while the code under it changes shape,
  # and the first person to run it months later cannot tell a fresh regression
  # from a bug that has been sitting there the whole time.
  #
  # Thirty seconds per target is not a campaign and is not pretending to be
  # one. What this bounded run actually gates:
  #
  #   * every target still builds under ASan and still links its entry point;
  #   * every target still loads its committed seeds and reaches real decode
  #     code (a target whose entry point started returning early would show up
  #     as a collapsed exec count, which -print_final_stats=1 puts in the log);
  #   * the whole committed seed corpus is replayed — that is the regression
  #     half, and it is deterministic rather than luck-of-the-mutator;
  #   * a *new* shallow panic reachable within seconds of the seeds fails the
  #     push that introduced it.
  #
  # Long campaigns stay a human's job (`just fuzz-run-seeded <target>
  # -max_total_time=…`). Deliberately NOT in `just health`: health is four
  # full workspace builds already and this adds an ASan release build of the
  # whole graph, but more decisively, a command someone chooses to run cannot
  # answer "nothing runs this automatically".
  #
  # `fuzz/` is its own Cargo workspace with its own Cargo.lock (libFuzzer's
  # instrumentation flags must not leak into a plain `cargo build
  # --workspace`), so it needs its own `workspaces:` cache row exactly like
  # `web/` does above — without it a dependency bump there is invisible to the
  # cache.
  fuzz:
    name: "fuzz: just fuzz-smoke (cargo-fuzz, seeded corpus)"
    runs-on: ubuntu-latest
    # Bounded because the ASan build below is a from-scratch release build of
    # lodestone-server, lodestone-worldgen and the v26-2 family with
    # codegen-units=1. On a cold cache that dominates the job; the fuzzing
    # itself is ~5 minutes of the total. A stuck build should report as this
    # job timing out rather than eating the workflow's budget.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install system audio dev headers (alsa-sys build dependency)
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          # Inert, like every other job's — `rust-toolchain.toml` pins the
          # nightly that cargo actually resolves. That pin is load-bearing
          # HERE and nowhere else in this file: libFuzzer's `-Zsanitizer` and
          # `-Cpasses=sancov-module` flags are nightly-only, so this job is
          # the one that would break first if the pin were ever dropped for a
          # stable channel. See this job's entry in docs/fuzzing.md.
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz-smoke
          workspaces: |
            .
            fuzz
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      # `--locked` so a fresh cargo-fuzz release cannot change what this job
      # runs without a commit here. Built from source rather than taken from a
      # third-party installer action to avoid adding a new trust dependency
      # for a two-minute build in a job that already spends far longer than
      # that compiling the fuzz targets themselves.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: just fuzz-smoke
        run: just fuzz-smoke 30
      # A crashing input is the whole product of a failing fuzz run, and it is
      # written to a path inside the runner that vanishes with the job. Upload
      # it so the reproducer is `just fuzz-repro <target> <downloaded-file>`
      # rather than "re-run the fuzzer and hope it finds the same thing".
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # The benchmark tripwire, and it exists for the same reason the wasm and
  # fuzz jobs above do: 29 criterion bench files existed, all real, and
  # nothing ran any of them on any schedule. Worse than an unrun test, a
  # benchmark whose only record is a gitignored per-machine log cannot be
  # compared by anyone who did not personally take the previous measurement.
  #
  # What this gates, and what it deliberately does not:
  #
  #   * GATED -- deterministic counts, compared against committed baselines in
  #     bench-baselines/ with a per-entry tolerance band, failing in EITHER
  #     direction. Per-frame draw/API-call counts, drawn and drawable section
  #     counts, emitted quads, atlas occupancy in pixels, and the structural
  #     heap footprint of a fixed column. Every one of those is a pure
  #     function of committed code plus a committed fixture, so it reads the
  #     same on this runner as on a developer's laptop.
  #   * NOT GATED -- every duration. Those keep the treatment they already
  #     have: recorded to bench-results/*.jsonl and compared by
  #     `cargo xtask bench-compare` against the same machine's own history.
  #     A committed duration baseline is a wall-clock ceiling on a shared
  #     runner, and this repo has already had one go red on healthy code.
  #
  # The count set is the one that matters most: the single real performance
  # regression this repo has found and fixed -- a render path rewriting one
  # camera uniform per resident section per frame -- was count-shaped, and
  # would have shown here as per-frame API calls tracking section count.
  #
  # `--min-compared` inside the recipe is load-bearing: without it, a bench
  # that silently stopped writing its log would leave the gate comparing
  # nothing and reporting green.
  bench-gate:
    name: "bench: just bench-record + bench-gate (committed count baselines)"
    runs-on: ubuntu-latest
    # Bounded because this is a from-scratch `bench`-profile build of
    # lodestone-render, lodestone-world and their graph (wgpu, naga) on a cold
    # cache. The benches themselves run in criterion's --test mode -- one
    # iteration each -- and take seconds; the build dominates.
    timeout-minutes: 60
    env:
      # The root Cargo.toml carries `[profile.release] debug = 2` so `samply`
      # can symbolize a local profiling run, and the `bench` profile inherits
      # it. Nothing in this job symbolizes anything -- it reads counts out of a
      # JSONL file -- so the DWARF is pure link time and disk. Turning it off
      # changes no codegen and no measured count, unlike an opt-level or
      # feature change, which is why it is safe to vary here and would not be
      # safe to vary in a job that published timings.
      CARGO_PROFILE_BENCH_DEBUG: 0
      # Same reasoning for the dependency graph: `cargo bench` builds this job's
      # ~200 dependency crates with the `release` profile, and that is where the
      # DWARF volume actually is.
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      # No apt step: neither lodestone-render nor lodestone-world reaches
      # cpal/alsa-sys, which enters the graph through lodestone-audio and
      # lodestone-shell -- and neither of those is in this job's package set.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          # Own key: the `bench` profile builds a different target/ from every
          # other job here, and sharing a key would thrash it.
          shared-key: bench-gate
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      # The gate's own control suite, before the gate: 25 checks including a
      # planted regression the gate must catch and a healthy fixture it must
      # pass. A regression detector that cannot itself be observed failing is
      # a description of a gate, not a gate -- and this is the cheap half,
      # seconds of pure python, so it runs first and fails fast.
      - name: just test-bench-gate (control suite for the gate itself)
        run: just test-bench-gate
      - name: just bench-record
        run: just bench-record
      - name: just bench-gate
        run: just bench-gate
      # The measurement log is the evidence behind whatever verdict the step
      # above printed, and it is gitignored, so it vanishes with the runner.
      # Uploaded on success as well as failure: a green run's numbers are how
      # anyone reconstructs what the baseline drifted from later.
      - name: Upload recorded measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results/
          if-no-files-found: warn

  test:
    name: "test: just test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system audio dev headers (alsa-sys build dependency)
        # Bounded because this step, not the suite, is what produced this
        # workflow's six-hour runs: two stalled about 359 minutes inside
        # apt-get update at the identical mirror line, before compiling
        # anything. It is the job's first step, so unbounded a hung mirror
        # burns the whole job budget and reports as a timeout of the build.
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-workspace
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      # The full suite. `.cache/` and `vendor/` are gitignored (no vanilla jar,
      # no minecraft-data checkout on a runner) and there is no GPU adapter, so
      # this intentionally does NOT run everything: 219 tests are #[ignore]d
      # for exactly that reason (live oracle, GPU adapter, or vanilla jar) and
      # do not execute here at all. See docs/ci.md for the inventory and how
      # to run them yourself. --no-fail-fast is not optional: plain `cargo
      # test` stops at the first failing test *binary*, so a later crate's
      # break is invisible — CLAUDE.md records this having hidden 3 failing
      # binaries / 14 failing tests behind one earlier, unrelated failure.
      - name: just test
        run: just test
      # A small, known set of NON-ignored tests intentionally self-skip (with a
      # loud eprintln!, not silently) when .cache/ or vendor/ is absent, per
      # their own doc comments — they anchor against a *committed* dump/table
      # either way, so a missing jar/minecraft-data checkout degrades their
      # coverage rather than failing the build. cargo test hides that eprintln
      # on a pass, so re-run just these by name with --nocapture and count the
      # "skipping" lines into the job summary — this is visibility, not a
      # weaker check: the tests above already ran (and passed) as part of the
      # full suite. See docs/ci.md for why each one is safe to self-skip here.
      - name: Surface self-skipped jar/vendor-dependent tests
        if: always()
        run: |
          set -eu
          : > /tmp/skip-report.txt
          # Fully-qualified with --exact: several of these names are
          # substrings of each other (e.g. codegen_is_deterministic is a
          # substring of registry_codegen_is_deterministic_and_standalone_rust)
          # so a plain substring filter would double-run and double-count.
          xtask_tests=(
            "tests::packet_id_check_accepts_pristine_and_rejects_corrupted_file"
            "tests::parses_real_packet_report_counts"
            "tests::generated_identifiers_are_unique_per_state_and_bound"
            "tests::generated_lookup_helpers_round_trip"
            "tests::codegen_is_deterministic"
            "tests::parses_real_registry_report_counts_for_dispatch_blockers"
            "tests::registry_codegen_is_deterministic_and_standalone_rust"
            "tests::parses_real_minecraft_data_report_for_protocol_47"
          )
          for name in "${xtask_tests[@]}"; do
            cargo test -p xtask -- "$name" --exact --nocapture 2>&1 | tee -a /tmp/skip-report.txt
          done
          data_tests=(
            "block_registry_order_agrees_with_mojangs_registries_report"
            "block_tag_membership_agrees_with_the_vanilla_datapack"
            "dump_agrees_with_mojangs_own_components_report"
          )
          for name in "${data_tests[@]}"; do
            cargo test -p lodestone-data --test tools -- "$name" --exact --nocapture 2>&1 | tee -a /tmp/skip-report.txt
          done
          count=$(grep -c "^skipping" /tmp/skip-report.txt || true)
          {
            echo "### Self-skipped jar/vendor-dependent tests"
            echo
            echo "These 11 non-ignored tests anchor against a committed dump and only"
            echo "self-skip (loudly) when \`.cache/\` or \`vendor/\` is absent, which is"
            echo "always true on this runner. See \`docs/ci.md\`."
            echo
            echo "**$count / 11 self-skipped** (expected: 11 on a runner with no jar/vendor checkout)"
            echo
            echo '```'
            grep "^skipping" /tmp/skip-report.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$count tests self-skipped (see step summary)"
          if [ "$count" -ne 11 ]; then
            echo "::warning::expected exactly 11 self-skipped tests, saw $count — either the runner unexpectedly has .cache/vendor, or one of these tests stopped self-skipping (which would mean it now needs attention, not that it silently started failing: the workspace test run above already exited 0)."
          fi
